        for (let dy = -10; dy <= 10; dy++) for (let dx = -10; dx <= 10; dx++) {
            const x = s.px + dx, y = s.py + dy;
            if (!isLand(x, y) || dx * dx + dy * dy > 100) continue;
            const gx = eleAt(x + 1, y) - eleAt(x - 1, y), gz = eleAt(x, y + 1) - eleAt(x, y - 1), m = gx * gx + gz * gz;
            if (m > best) { best = m; bx0 = x; by0 = y; gxB = gx; gzB = gz; }
        }
        const yaw = Math.atan2(-gzB, -gxB), o = { px: bx0, py: by0 };
        const [ux, uy] = localPx(o, yaw, -1.2, 0), [dx2, dy2] = localPx(o, yaw, 2.6, 0);
        const top = groundY(ux, uy) + 0.15, bot = Math.min(top - 1.6, groundY(dx2, dy2) + 0.08);
        K.frame(bx0 - CX, 0, by0 - CZ, yaw).coarse().col(AC.line);
        K.poly([[-0.6, top, -1.8], [0.0, top + 0.12, -0.9], [0.15, top + 0.06, 0], [0.0, top + 0.1, 0.9], [-0.5, top, 1.8]]);   // mép vách
        K.col(AC.water);
        for (let i = 0; i < 7; i++) {                                         // bảy dải nước đổ, cong ra theo quán tính
            const v = -1.05 + i * 0.35;
            K.curve(f => [0.15 + 1.2 * f * f + 0.05 * Math.sin(f * 9 + i), top + (bot - top) * f, v + 0.05 * Math.sin(f * 7 + i * 1.3)], 12);
        }
        K.ell(1.9, bot + 0.02, 0, 1.6, 1.3, 22);                               // vũng thác
        K.fine().col(AC.water, 0.7).ell(1.9, bot + 0.03, 0, 0.9, 0.7, 14).ell(1.9, bot + 0.03, 0, 0.45, 0.35, 10)
            .drape(f => [3.5 + f * 6, 0.35 * Math.sin(f * 4)], 24, 0.05);    // suối chảy tiếp
        K.col(AC.detail, 0.85);
        const gB = K.gy(4.6, 0) + 0.55;                                       // cầu gỗ qua suối
        for (const u of [4.3, 4.9]) K.seg(u, gB, -1.3, u, gB, 1.3);
        for (let v = -1.2; v <= 1.21; v += 0.3) K.seg(4.3, gB, v, 4.9, gB, v);
        for (const u of [4.3, 4.9]) K.seg(u, gB + 0.4, -1.2, u, gB + 0.4, 1.2).seg(u, gB, -1.2, u, gB + 0.4, -1.2).seg(u, gB, 1.2, u, gB + 0.4, 1.2);
        for (let i = 0; i < 8; i++) {                                         // bậc đá lên đỉnh thác
            const u = 1.6 - i * 0.28, g = K.gy(u, 2.2) + 0.05;
            K.seg(u, g, 1.9, u, g, 2.5);
        }
        K.coarse().col(AC.line, 0.8);
        for (const [u, v] of [[0.6, -1.6], [1.0, 1.7], [3.2, -1.3]]) { const g = K.gy(u, v); K.box(u, v, 0.4, 0.35, g, 0.25); }   // đá tảng
    }

    /*  TIÊN SƠN ĐỈNH — chòi ngắm cảnh trên đỉnh: bốn cột, mái hai tầng đầu đao
        cong kiểu đình, lan can bao, cột cờ. */
    function viewpoint(K, s) {
        const base = footY(s.px, s.py, 2);
        K.frame(s.x, base, s.z, 0).coarse().col(AC.line);
        for (const [a, b] of [[-0.8, -0.8], [0.8, -0.8], [0.8, 0.8], [-0.8, 0.8]]) K.seg(a, 0, b, a, 1.1, b);
        K.rect(-1.1, -1.1, 1.1, 1.1, 0.02);
        K.col(AC.roof).curvedRoof(0, 0, 2.6, 2.6, 1.1, 0.45, 0.28).curvedRoof(0, 0, 1.5, 1.5, 1.6, 0.55, 0.2);
        K.fine().col(AC.detail, 0.8).rect(-1.0, -1.0, 1.0, 1.0, 0.45);
        for (let i = -1; i <= 1; i += 0.25) K.seg(i, 0, -1.0, i, 0.45, -1.0).seg(i, 0, 1.0, i, 0.45, 1.0);
        K.seg(1.6, 0, 1.6, 1.6, 2.6, 1.6).col(AC.red).rect(1.6, 1.6, 2.1, 1.61, 2.55);
    }

    /*  BẢO TÀNG CỘI NGUỒN — nhà chính mái cong hai tầng, sân trong có tường bao,
        cổng tam quan ba gian với mái nhỏ. */
    function museum(K, s) {
        const yaw = dirTo(s.px, s.py, false);
        const base = footY(s.px, s.py, 4);
        K.frame(s.x, base, s.z, yaw).coarse().col(AC.line);
        K.box(-1.2, 0, 2.4, 4.4, 0, 1.0).col(AC.roof).curvedRoof(-1.2, 0, 4.4, 2.4, 1.0, 0.6, 0.25).curvedRoof(-1.2, 0, 3.0, 1.5, 1.45, 0.5, 0.18);
        K.col(AC.line).rect(-3.2, -3.4, 3.2, 3.4, 0.4);
        for (const v of [-1.1, 0, 1.1]) K.box(3.2, v, 0.5, 0.8, 0, v ? 0.75 : 0.95);
        K.col(AC.roof).curvedRoof(3.2, 0, 0.7, 1.0, 0.95, 0.3, 0.12).curvedRoof(3.2, -1.1, 0.7, 0.9, 0.75, 0.25, 0.1).curvedRoof(3.2, 1.1, 0.7, 0.9, 0.75, 0.25, 0.1);
        K.fine().col(AC.detail, 0.8).mullions(-1.2, 0, 2.4, 4.4, 0, 1.0, 0.55);
        K.col(AC.leaf, 0.8);
        for (const [u, v] of [[1.6, -2.2], [1.6, 2.2], [-2.6, -2.6], [-2.6, 2.6]]) K.tree(u, 0, v, 1.1, 0.4);
    }

    /* ════════ GIAO THÔNG ════════ */

    /*  SÂN BAY QUỐC TẾ PHÚ QUỐC — dựng trong hệ toạ độ CỦA ĐƯỜNG BĂNG 10/28 lấy từ
        dữ liệu (u dọc đường băng từ đầu tây, v vuông góc, dương về phía nam). Theo
        chính các đường lăn trong dữ liệu, sân đỗ nằm ở phía nam, đoạn u ≈ 47–66,
        tới v ≈ 12,4 — nhà ga đặt ngay sau mép sân đỗ đó: mái sóng, mặt kính, 5 ống
        lồng, tàu bay đỗ đầu vào ống lồng; đài kiểm soát, nhà chứa máy bay mái vòm,
        bồn nhiên liệu, bãi xe. */
    function airport(K, A) {
        const rw = RUNWAYS.map(c => c.map(([lon, lat]) => lonLatToPx(lon, lat)))
            .map(p => ({ a: p[0], b: p[p.length - 1], L: Math.hypot(p[p.length - 1][0] - p[0][0], p[p.length - 1][1] - p[0][1]) }))
            .sort((x, y) => x.L - y.L)[0];
        if (!rw) return;
        const [a, b] = rw.a[0] < rw.b[0] ? [rw.a, rw.b] : [rw.b, rw.a];
        const yaw = Math.atan2(b[1] - a[1], b[0] - a[0]), RL = rw.L;
        const gy = footY((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, 2);
        K.frame(a[0] - CX, gy, a[1] - CZ, yaw);
        //  Nhà ga: bệ kính + mái sóng nhẹ, mặt kính phía sân đỗ.
        const tu = RL * 0.715, tv = 15.2, TL = 13;
        K.coarse().col(AC.line).box(tu, tv, TL, 2.8, 0, 0.9);
        const ry = u => 1.1 + 0.22 * Math.sin((u - tu) * 0.75);
        for (const v of [tv - 1.75, tv + 1.75]) K.curve(f => { const u = tu - TL / 2 - 0.4 + (TL + 0.8) * f; return [u, ry(u) - 0.18, v]; }, 26);
        K.curve(f => { const u = tu - TL / 2 - 0.4 + (TL + 0.8) * f; return [u, ry(u) + 0.12, tv]; }, 26);
        K.fine().col(AC.detail, 0.75);
        for (let u = tu - TL / 2 - 0.4; u <= tu + TL / 2 + 0.41; u += 0.8)
            K.seg(u, ry(u) - 0.18, tv - 1.75, u, ry(u) + 0.12, tv).seg(u, ry(u) + 0.12, tv, u, ry(u) - 0.18, tv + 1.75);
        K.col(AC.glass, 0.85).mullions(tu, tv, TL, 2.8, 0, 0.9, 0.5, [-1]);
        //  Ống lồng & tàu bay đỗ (mũi quay vào nhà ga, tức hướng +v).
        const hx = -Math.sin(yaw), hz = Math.cos(yaw);
        for (let i = 0; i < 5; i++) {
            const u = tu - 6.5 + i * 3.25, v0 = tv - 1.4, v1 = 11.0;
            K.coarse().col(AC.line).seg(u - 0.15, 0.75, v0, u - 0.55, 0.75, v1).seg(u + 0.15, 0.75, v0, u - 0.25, 0.75, v1);
            K.fine().col(AC.detail, 0.8).ell(u, 0.75, v0 - 0.2, 0.3, 0.3, 8).seg(u - 0.4, 0, v1 + 0.3, u - 0.4, 0.75, v1 + 0.3);
            const wx = K.wx(u - 0.4, 9.4), wz = K.wz(u - 0.4, 9.4);
            K.frame(0, 0, 0, 0).coarse().col(AC.line).stamp(SHP_PLANE, wx, gy + 0.08, wz, hx, hz, 1.25, 0, PLANE_LIGHTS - 2);
            K.fine().col(AC.detail, 0.8).stamp(SHP_PLANE, wx, gy + 0.08, wz, hx, hz, 1.25, PLANE_LIGHTS - 2, PLANE_LIGHTS);
            K.frame(a[0] - CX, gy, a[1] - CZ, yaw);
        }
        K.fine().col(AC.detail, 0.55).dashed(0.4).rect(tu - TL / 2 - 2.5, 5.7, tu + TL / 2 + 1.2, 12.6, 0.03).dashed(0);
        //  Đài kiểm soát không lưu.
        const cu = tu - TL / 2 - 3.2, cv = 15.4;
        K.coarse().col(AC.line).cyl(cu, cv, 0.3, 0, 3.4, 10, 4);
        K.ell(cu, 3.4, cv, 0.66, 0.66, 8).ell(cu, 3.95, cv, 0.66, 0.66, 8);
        for (let i = 0; i < 8; i++) { const t = i / 8 * Math.PI * 2; K.seg(cu + Math.cos(t) * 0.66, 3.4, cv + Math.sin(t) * 0.66, cu + Math.cos(t) * 0.66, 3.95, cv + Math.sin(t) * 0.66); }
        K.col(AC.roof).pyramid(cu, cv, 1.2, 1.2, 3.95, 0.22, 0.05).col(AC.line).seg(cu, 4.17, cv, cu, 4.9, cv);
        K.fine().col(AC.glass, 0.9).ell(cu, 3.7, cv, 0.67, 0.67, 8);
        //  Nhà chứa máy bay mái vòm, bồn nhiên liệu, bãi đỗ xe.
        const hu = RL * 0.39, hv = 12.4;
        K.coarse().col(AC.line);
        for (let i = 0; i <= 5; i++) { const u = hu - 2 + i * 0.8; K.curve(f => [u, Math.sin(f * Math.PI) * 1.4, hv - 1.5 + 3 * f], 10); }
        K.seg(hu - 2, 0, hv - 1.5, hu + 2, 0, hv - 1.5).seg(hu - 2, 0, hv + 1.5, hu + 2, 0, hv + 1.5).curve(f => [hu - 2 + 4 * f, 1.4, hv], 1);
        K.fine().col(AC.detail, 0.8);
        for (let i = 0; i < 3; i++) K.cyl(hu + 4.2 + i * 1.1, hv + 2.6, 0.45, 0, 0.45, 12, 4);
        K.col(AC.detail, 0.5).rect(tu - 6, tv + 2.4, tu + 6, tv + 5, 0.02);
        for (let u = tu - 5.5; u <= tu + 5.6; u += 0.5) K.seg(u, 0.02, tv + 2.4, u, 0.02, tv + 3.3).seg(u, 0.02, tv + 4.1, u, 0.02, tv + 5);

        /*  Máy bay đang bay — bay ĐÚNG VÒNG LƯỢN quanh đường băng: tiếp cận chót
            dọc tim đường băng, chạm bánh, chạy đà, cất cánh lại, vòng gió xuôi —
            và một chiếc chờ hạ cánh trên đường bay vòng cao hơn. */
        const W = (u, v, alt) => [K.wx(u, v), gy + alt, K.wz(u, v)];
        const circuit = [[-80, 0, 10], [0, 0, 0.7], [RL * 0.45, 0, 0.55], [RL, 0, 3.5], [RL + 50, 0, 11], [RL + 90, -32, 16],
            [RL + 40, -66, 18], [-25, -66, 18], [-85, -48, 15], [-110, -14, 12]].map(([u, v, h]) => W(u, v, h));
        const hold = []; for (let i = 0; i < 24; i++) { const t = i / 24 * Math.PI * 2; hold.push(W(RL * 0.5 + Math.cos(t) * 55, -105 + Math.sin(t) * 26, 36)); }
        const paths = [splinePath(circuit, 12), splinePath(hold, 6)];
        const NP = 2, segN = SHP_PLANE.length / 6;
        const P = linePool(NP * segN, i => { const k = i % segN; return k === PLANE_LIGHTS ? rgba(AC.red) : k === PLANE_LIGHTS + 1 ? rgba(AC.green) : k === PLANE_LIGHTS + 2 ? rgba(0xffffff) : rgba(AC.line, 0.95); });
        A.group.add(P.mesh);
        A.upd.push(tt => {
            pen.at(P.arr, 0);
            for (let p = 0; p < NP; p++) {
                const path = paths[p], d = (tt * (p ? 9 : 12) + p * 40) % path.len;
                pathAt(path, d, _pp);
                pen.frame(_pp[0], _pp[1], _pp[2], _pp[3], _pp[4], 2.3);
                pen.shape(SHP_PLANE);
            }
            P.mesh.geometry.attributes.position.needsUpdate = true;
        });
    }
    let RUNWAYS = [];

    /*  Đường cong khép kín Catmull–Rom qua các điểm, lấy mẫu thành đa tuyến có
        độ dài tích luỹ — để vật chạy đều tốc độ và quay đầu theo tiếp tuyến. */
    function splinePath(P, per) {
        const n = P.length, pts = [];
        for (let i = 0; i < n; i++) {
            const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
            for (let k = 0; k < per; k++) {
                const t = k / per, t2 = t * t, t3 = t2 * t;
                pts.push([0, 1, 2].map(j => 0.5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
            }
        }
        pts.push(pts[0]);
        return lengthPath(pts);
    }
    function lengthPath(pts) {
        const flat = new Float64Array(pts.length * 4);
        let L = 0;
        for (let i = 0; i < pts.length; i++) {
            if (i) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][2] - pts[i - 1][2]);
            flat[i * 4] = pts[i][0]; flat[i * 4 + 1] = pts[i][1]; flat[i * 4 + 2] = pts[i][2]; flat[i * 4 + 3] = L;
        }
        return { p: flat, n: pts.length, len: L };
    }
    //  Vị trí + hướng tại độ dài d trên đa tuyến → out = [x, y, z, hx, hz].
    const _pp = [0, 0, 0, 1, 0];
    function pathAt(path, d, out) {
        const p = path.p;
        let lo = 0, hi = path.n - 1;
        while (hi - lo > 1) { const m = (lo + hi) >> 1; if (p[m * 4 + 3] < d) lo = m; else hi = m; }
        const i = lo * 4, j = hi * 4, seg = p[j + 3] - p[i + 3] || 1, f = Math.min(1, Math.max(0, (d - p[i + 3]) / seg));
        const dx = p[j] - p[i], dz = p[j + 2] - p[i + 2], L = Math.hypot(dx, dz) || 1;
        out[0] = p[i] + dx * f; out[1] = p[i + 1] + (p[j + 1] - p[i + 1]) * f; out[2] = p[i + 2] + dz * f;
        out[3] = dx / L; out[4] = dz / L;
        return out;
    }

    /*  CẢNG — cầu cảng nhô ra theo đúng hướng ra biển tại chỗ, có cọc, cột bích,
        đầu chữ T; mỗi cảng mang đúng "tính cách" của nó: An Thới có tàu cao tốc
        cập, Bãi Vòng có cầu dẫn ro-ro và phà chở xe, Dương Đông có tàu du lịch
        quốc tế 5 sao neo dọc bến, hai cảng cá có đê chắn sóng và đội thuyền neo. */
    function port(K, s, kind) {
        const c = coastSite(s.px, s.py), yaw = c.sea, SY = SEA_Y(), dk = SY + 0.8;
        const hx = Math.cos(yaw), hz = Math.sin(yaw);
        K.frame(c.x, 0, c.z, yaw);
        const jetty = (len, w, tw) => {
            K.coarse().col(AC.line);
            for (const v of [-w / 2, w / 2]) K.seg(-0.5, Math.max(dk, c.y), v, len, dk, v);
            if (tw) K.rect(len, -tw / 2, len + 1.6, tw / 2, dk);
            K.fine().col(AC.detail, 0.75);
            for (let u = 1; u < len; u += 1.5) for (const v of [-w / 2, w / 2]) K.seg(u, SY - 0.8, v, u, dk, v);
            for (let u = 2; u < len; u += 2) for (const v of [-w / 2, w / 2]) K.seg(u, dk, v, u, dk + 0.18, v);
        };
        const shed = (u, v, w, d, h) => {
            const [x, y] = localPx(c, yaw, u, v);
            if (!isLand(x, y)) return;
            const g = footY(x, y, 2);
            K.coarse().col(AC.line).box(u, v, w, d, g, h).col(AC.roof).gable(u, v, w, d, g + h, 0.45, 0.15);
            K.fine().col(AC.glass, 0.8).mullions(u, v, w, d, g, h, 0.5, [1]);
        };
        const ship = (shape, u, v, s, dirSign) => {
            const wx = K.wx(u, v), wz = K.wz(u, v);
            const ux = Math.cos(yaw + Math.PI / 2) * dirSign, uz = Math.sin(yaw + Math.PI / 2) * dirSign;   // neo dọc bến (song song bờ)
            K.frame(0, 0, 0, 0).coarse().col(AC.line).stamp(shape, wx, SY, wz, ux, uz, s);
            K.frame(c.x, 0, c.z, yaw);
        };
        if (kind === 'ferry') {                                               // An Thới
            jetty(9, 1.2, 6);
            ship(SHP_FERRY, 11.5, 0, 1.9, 1);
            shed(-3.2, 0, 2, 4, 1.1);
        } else if (kind === 'roro') {                                         // Bãi Vòng
            jetty(8, 1.4, 5);
            K.coarse().col(AC.line).seg(9.6, dk, -1.2, 11.2, SY - 0.1, -1.0).seg(9.6, dk, 1.2, 11.2, SY - 0.1, 1.0);
            //  Phà ro-ro: thân hộp, cầu dẫn đuôi hạ xuống, buồng lái ở mũi.
            const wx = K.wx(14.6, 0), wz = K.wz(14.6, 0);
            K.frame(0, 0, 0, 0).col(AC.line);
            const rox = [[-3, -1], [3, -1], [3.6, 0], [3, 1], [-3, 1]];
            K.poly(rox.map(([u, q]) => [wx + hx * u - hz * q, SY + 0.45, wz + hz * u + hx * q]), true);
            K.poly(rox.map(([u, q]) => [wx + hx * u - hz * q, SY + 0.1, wz + hz * u + hx * q]), true);
            K.box(wx + hx * 2.4, wz + hz * 2.4, 1.0, 1.0, SY + 0.45, 0.8);
            K.fine().col(AC.detail, 0.8);
            for (let u = -2.5; u <= 1.5; u += 0.5) K.seg(wx + hx * u - hz * -0.9, SY + 0.46, wz + hz * u + hx * -0.9, wx + hx * u - hz * 0.9, SY + 0.46, wz + hz * u + hx * 0.9);
            K.frame(c.x, 0, c.z, yaw);
            shed(-3, -2.5, 2.2, 3.2, 1.0);
            const [x, y] = localPx(c, yaw, -4, 3);
            if (isLand(x, y)) {
                const g = groundY(x, y) + 0.02;
                K.fine().col(AC.detail, 0.5).rect(-6, 1.5, -2.5, 4.5, g);
                for (let v = 1.5; v <= 4.51; v += 0.5) K.seg(-6, g, v, -4.8, g, v);
            }
        } else if (kind === 'cruise') {                                       // Dương Đông quốc tế
            jetty(10, 1.2, 0);
            K.coarse().col(AC.line).rect(10, -8, 11.6, 8, dk);
            cruiseShip(K, K.wx(13.0, 0), K.wz(13.0, 0), Math.cos(yaw + Math.PI / 2), Math.sin(yaw + Math.PI / 2));
            K.frame(c.x, 0, c.z, yaw);
            const [x, y] = localPx(c, yaw, -3, 0);
            if (isLand(x, y)) {
                const g = footY(x, y, 2);
                K.coarse().col(AC.line).box(-3, 0, 2.2, 5, g, 1.0);
                K.curve(f => { const v = -2.9 + 5.8 * f; return [-3, g + 1.25 + 0.2 * Math.sin(v * 1.6), v]; }, 16);
                K.fine().col(AC.glass, 0.85).mullions(-3, 0, 2.2, 5, g, 1.0, 0.45, [1]);
            }
        } else {                                                              // cảng cá
            jetty(5, 1.0, 0);
            K.coarse().col(AC.line).curve(f => { const a = -0.9 + 1.5 * f; return [3 + Math.cos(a) * 7, SY + 0.3, Math.sin(a) * 7 - 2]; }, 16);
            K.fine().col(AC.detail, 0.75).curve(f => { const a = -0.9 + 1.5 * f; return [3 + Math.cos(a) * 7.4, SY + 0.1, Math.sin(a) * 7.4 - 2]; }, 16);
            for (let i = 0; i < 7; i++) {
                const v = -4.2 + i * 1.2, u = 2.2 + (i % 2) * 0.4, wx = K.wx(u, v), wz = K.wz(u, v);
                K.frame(0, 0, 0, 0).coarse().col(AC.line).stamp(SHP_FISH, wx, SY, wz, hx, hz, 1.1, 0, 7);
                K.fine().col(AC.detail, 0.8).stamp(SHP_FISH, wx, SY, wz, hx, hz, 1.1, 7);
                if (i % 3 === 0) K.col(AC.warm).stamp(SHP_SQUID, wx, SY, wz, hx, hz, 1.1);
                K.frame(c.x, 0, c.z, yaw);
            }
            const [x, y] = localPx(c, yaw, -2.6, 0);
            if (isLand(x, y)) {                                               // chợ cá: mái lớn, cột trống
                const g = footY(x, y, 2);
                K.coarse().col(AC.roof).gable(-2.6, 0, 3.6, 2.2, g + 0.9, 0.6, 0.2);
                K.col(AC.line);
                for (const [u, v] of [[-1.7, -1.0], [1.7, -1.0], [1.7, 1.0], [-1.7, 1.0], [0, -1.0], [0, 1.0]]) K.seg(-2.6 + u * 0.95, g, v, -2.6 + u * 0.95, g + 0.9, v);
            }
        }
    }

    //  Tàu du lịch quốc tế neo dọc bến: thân, 6 tầng boong bậc thang, vách ban
    //  công, ống khói, xuồng cứu sinh, cột ăng-ten.
    function cruiseShip(K, x, z, hx, hz) {
        const SY = SEA_Y(), L = 7.0, B = 1.0;
        const P = (u, y, q) => [x + hx * u - hz * q, SY + y, z + hz * u + hx * q];
        K.frame(0, 0, 0, 0).coarse().col(AC.detail);
        const hull = [[L, 0], [L * 0.8, -B], [-L * 0.95, -B], [-L, -B * 0.6], [-L, B * 0.6], [-L * 0.95, B], [L * 0.8, B]];
        K.poly(hull.map(([u, q]) => P(u, 0.9, q)), true).poly(hull.map(([u, q]) => P(u * 0.98, 0.05, q * 0.9)), true);
        K.seg(...P(L, 0.9, 0), ...P(L * 0.93, 0.05, 0));
        const decks = [[0.9, -6.3, 5.4], [1.25, -6.0, 5.0], [1.6, -5.6, 4.6], [1.95, -5.0, 4.0], [2.3, -4.0, 3.0], [2.65, -2.6, 1.6]];
        for (const [y, u0, u1] of decks) K.poly([P(u0, y, -B * 0.92), P(u1, y, -B * 0.92), P(u1 + 0.4, y, 0), P(u1, y, B * 0.92), P(u0, y, B * 0.92)], true);
        K.box(...[x + hx * -3.2, z + hz * -3.2], 0.8, 0.8, SY + 2.65, 0.7);
        K.seg(...P(-0.5, 2.65, 0), ...P(-0.5, 3.6, 0));
        K.fine().col(AC.detail, 0.7);
        for (let u = -6; u < 5; u += 0.35) for (const q of [-B * 0.92, B * 0.92]) K.seg(...P(u, 0.9, q), ...P(u, 1.6, q));
        K.col(AC.warm, 0.95);
        for (let u = -4.5; u <= 3.5; u += 1.0) for (const q of [-1.02, 1.02]) K.seg(...P(u, 0.7, q), ...P(u + 0.6, 0.7, q));
        K.col(AC.line);
    }

    /*  CÁP TREO HÒN THƠM — tuyến 3 dây dài 7,9 km. Dữ liệu OSM chỉ có hai đầu ga,
        nên bản trước dựng đúng 2 trụ và một sợi cáp thẳng băng qua 8 km biển.
        Nay trụ đặt theo địa hình THẬT dọc tuyến: lấy mẫu từng pixel, trụ dựng trên
        từng đảo, mỏm đất mà tuyến vắt qua, thêm trụ giữa biển (móng giếng chìm)
        nơi nhịp quá dài. Trụ giàn thép thu nhỏ dần lên đỉnh có xà ngang đỡ hai làn
        cáp; cáp võng xuống giữa nhịp; hai ga có nhà ga và bánh xe quay đầu; cabin
        chạy ngược chiều nhau trên hai làn. */
    function cableCar(K, A) {
        const route = CABLE.slice().sort((x, y) => routeLen(y) - routeLen(x))[0];
        if (!route) return;
        const pts = route.map(([lon, lat]) => lonLatToPx(lon, lat));
        const a = pts[0], b = pts[pts.length - 1], Lr = Math.hypot(b[0] - a[0], b[1] - a[1]);
        const dx = (b[0] - a[0]) / Lr, dz = (b[1] - a[1]) / Lr, nx = -dz, nz = dx;
        //  Đất / nước dọc tuyến, từng pixel.
        const land = [], gnd = [];
        for (let i = 0; i <= Lr; i++) { const x = a[0] + dx * i, y = a[1] + dz * i; land.push(isLand(x, y)); gnd.push(groundY(x, y)); }
        const towers = [0];
        let i = 1;
        while (i < land.length - 1) {                                         // giữa mỗi dải đất ≥ 4 px
            if (!land[i]) { i++; continue; }
            let j = i; while (j < land.length - 1 && land[j]) j++;
            if (j - i >= 4) { let m = i; for (let k = i; k < j; k++) if (gnd[k] > gnd[m]) m = k; towers.push(m); }
            i = j + 1;
        }
        towers.push(Math.floor(Lr));
        const clean = [towers[0]];
        for (const t of towers.slice(1)) if (t - clean[clean.length - 1] >= 14 || t === towers[towers.length - 1]) clean.push(t);
        const full = [clean[0]];
        for (let k = 1; k < clean.length; k++) {                              // nhịp dài > 48 px → trụ giữa biển
            const span = clean[k] - clean[k - 1], n = Math.floor(span / 48);
            for (let q = 1; q <= n; q++) full.push(Math.round(clean[k - 1] + span * q / (n + 1)));
            full.push(clean[k]);
        }
        const SY = SEA_Y();
        const T = full.map((d, k) => {
            const x = a[0] + dx * d, y = a[1] + dz * d, g = Math.max(groundY(x, y), SY), end = k === 0 || k === full.length - 1;
            return { d, x: x - CX, z: y - CZ, g, top: end ? g + 2.2 : Math.max(g + 4.6, SY + 7.5), sea: !isLand(x, y), end };
        });
        K.frame(0, 0, 0, 0);
        for (const t of T) {
            if (t.end) continue;
            const P = (u, y, v) => [t.x + dx * u + nx * v, y, t.z + dz * u + nz * v];
            K.coarse().col(AC.line);
            for (const s of [-1, 1]) K.seg(...P(0, t.g, s * 1.0), ...P(0, t.top, s * 0.35));
            K.seg(...P(0, t.top, -0.85), ...P(0, t.top, 0.85));
            if (t.sea) K.cyl(t.x, t.z, 0.75, SY - 1.0, 1.4, 12, 4);
            K.fine().col(AC.detail, 0.75);
            const H = t.top - t.g, n = Math.max(3, Math.round(H / 1.0));
            for (let k = 0; k < n; k++) {
                const f0 = k / n, f1 = (k + 1) / n, w0 = 1.0 - 0.65 * f0, w1 = 1.0 - 0.65 * f1;
                K.seg(...P(0, t.g + H * f0, -w0), ...P(0, t.g + H * f1, w1)).seg(...P(0, t.g + H * f0, w0), ...P(0, t.g + H * f1, -w1));
            }
            K.rect(t.x - 0.9, t.z - 0.9, t.x + 0.9, t.z + 0.9, t.g + 0.02);
        }
        //  Hai làn cáp võng: mỗi nhịp là parabol, võng 3,5% chiều dài nhịp.
        const lanes = [-0.6, 0.6].map(off => {
            const P = [];
            for (let k = 0; k < T.length - 1; k++) {
                const A0 = T[k], B0 = T[k + 1], span = B0.d - A0.d, sag = Math.max(0.3, span * 0.035);
                for (let q = 0; q < 14; q++) {
                    const f = q / 14;
                    P.push([A0.x + (B0.x - A0.x) * f + nx * off, A0.top + (B0.top - A0.top) * f - 4 * sag * f * (1 - f), A0.z + (B0.z - A0.z) * f + nz * off]);
                }
            }
            const L = T[T.length - 1];
            P.push([L.x + nx * off, L.top, L.z + nz * off]);
            return P;
        });
        K.coarse().col(AC.line);
        for (const P of lanes) K.poly(P);
        K.fine().col(AC.detail, 0.6);
        for (const P of lanes) K.poly(P.map(p => [p[0], p[1] + 0.2, p[2]]));
        //  Ga hai đầu: nhà ga mái dốc + bánh xe quay đầu cáp.
        for (const t of [T[0], T[T.length - 1]]) {
            const sgn = t === T[0] ? 1 : -1;
            K.frame(t.x, t.g, t.z, Math.atan2(dz, dx)).coarse().col(AC.line).box(-sgn * 0.8, 0, 3.2, 2.4, 0, 1.2);
            K.col(AC.roof).seg(-sgn * 0.8 - 1.8, 1.2, -1.4, -sgn * 0.8 + 1.8, 2.0, -1.4).seg(-sgn * 0.8 - 1.8, 1.2, 1.4, -sgn * 0.8 + 1.8, 2.0, 1.4)
                .seg(-sgn * 0.8 - 1.8, 1.2, -1.4, -sgn * 0.8 - 1.8, 1.2, 1.4).seg(-sgn * 0.8 + 1.8, 2.0, -1.4, -sgn * 0.8 + 1.8, 2.0, 1.4);
            K.fine().col(AC.detail, 0.8).ell(sgn * 0.6, 1.9, 0, 0.75, 0.75, 14).mullions(-sgn * 0.8, 0, 3.2, 2.4, 0, 1.2, 0.45);
            K.frame(0, 0, 0, 0);
        }
        //  Ô bao đất ga (vòng lặp nhỏ trong OSM).
        K.fine().col(AC.detail, 0.6);
        for (const r of CABLE) if (r !== route && r.length > 2) K.poly(r.map(([lon, lat]) => { const [px, py] = lonLatToPx(lon, lat); return [px - CX, groundY(px, py) + 0.05, py - CZ]; }), false);
        //  Cabin: 7 mỗi làn, hai làn chạy ngược chiều nhau.
        const paths = lanes.map(lengthPath), NC = 7, CS = 14;
        const Pc = linePool(NC * 2 * CS, i => (i % CS) >= 12 ? rgba(AC.detail) : rgba(AC.warm, 0.95));
        A.group.add(Pc.mesh);
        const CAB = [
            -0.45, -0.95, -0.3, 0.45, -0.95, -0.3, 0.45, -0.95, -0.3, 0.45, -0.95, 0.3, 0.45, -0.95, 0.3, -0.45, -0.95, 0.3, -0.45, -0.95, 0.3, -0.45, -0.95, -0.3,
            -0.45, -0.3, -0.3, 0.45, -0.3, -0.3, 0.45, -0.3, -0.3, 0.45, -0.3, 0.3, 0.45, -0.3, 0.3, -0.45, -0.3, 0.3, -0.45, -0.3, 0.3, -0.45, -0.3, -0.3,
            -0.45, -0.95, -0.3, -0.45, -0.3, -0.3, 0.45, -0.95, 0.3, 0.45, -0.3, 0.3, 0.45, -0.95, -0.3, 0.45, -0.3, -0.3, -0.45, -0.95, 0.3, -0.45, -0.3, 0.3,
            0, -0.3, 0, 0, 0.02, 0, -0.25, 0.02, 0, 0.25, 0.02, 0
        ];
        A.upd.push(tt => {
            pen.at(Pc.arr, 0);
            for (let l = 0; l < 2; l++) {
                const path = paths[l];
                for (let c = 0; c < NC; c++) {
                    let d = (tt * 3.2 + c / NC * path.len) % path.len;
                    if (l) d = path.len - d;
                    pathAt(path, d, _pp);
                    pen.frame(_pp[0], _pp[1], _pp[2], _pp[3], _pp[4], 1);
                    pen.shape(CAB);
                }
            }
            Pc.mesh.geometry.attributes.position.needsUpdate = true;
        });
    }
    const routeLen = r => { let L = 0; for (let i = 1; i < r.length; i++) L += Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]); return L; };

    /*  PHÀ — chạy ĐÚNG 4 tuyến trong dữ liệu (đường nét đứt trên mặt biển): đi
        hết tuyến, quay đầu, chạy về. Thân phà là hình mẫu catamaran hai thân. */
    function ferryTraffic(A) {
        const routes = FERRY_ROUTES.features.map(f => lengthPath(f.geometry.coordinates.map(([lon, lat]) => {
            const [px, py] = lonLatToPx(lon, lat); return [px - CX, SEA_Y() + 0.05, py - CZ];
        })));
        const segN = SHP_FERRY.length / 6 + 4;
        const P = linePool(routes.length * segN, i => (i % segN) >= segN - 4 ? rgba(AC.wake, 0.7) : rgba(AC.line, 0.95));
        A.group.add(P.mesh);
        A.upd.push(tt => {
            pen.at(P.arr, 0);
            for (let r = 0; r < routes.length; r++) {
                const path = routes[r], ph = (tt * 7 / path.len + r * 0.37) % 2, fwd = ph < 1;
                pathAt(path, (fwd ? ph : 2 - ph) * path.len, _pp);
                const hx = fwd ? _pp[3] : -_pp[3], hz = fwd ? _pp[4] : -_pp[4];
                pen.frame(_pp[0], _pp[1], _pp[2], hx, hz, 1.8);
                pen.shape(SHP_FERRY);
                pen.shape(SHP_FERRY_WAKE);
            }
            P.mesh.geometry.attributes.position.needsUpdate = true;
        });
    }

    /* ════════ HẠ TẦNG ════════ */

    /*  ĐẬP HỒ DƯƠNG ĐÔNG & TRẠM BƠM — đập đất mặt cắt hình thang (đỉnh đập có
        đường, mái thượng lưu, mái hạ lưu, cơ đập), tràn xả lũ bậc nước, tháp lấy
        nước giữa lòng hồ có cầu công tác nối ra đỉnh đập, trạm bơm nước thô phía
        hạ lưu với hai đường ống. Tuyến đập đặt VUÔNG GÓC với hướng từ lòng hồ ra
        đập — đúng cách một con đập chặn ngang thung lũng. */
    function damAndPump(K, dam, lake) {
        const yaw = Math.atan2(dam.py - lake.py, dam.px - lake.px);             // +x: xuôi về hạ lưu
        const cy = footY(dam.px, dam.py, 3) + 0.3;
        K.frame(dam.x, cy, dam.z, yaw).coarse().col(AC.line);
        for (const u of [-0.35, 0.35]) K.seg(u, 0, -5, u, 0, 5);
        K.seg(-2.4, -1.3, -5.5, -2.4, -1.3, 5.5).seg(2.8, -1.6, -5.8, 2.8, -1.6, 5.8);
        for (const v of [-5, 5]) K.seg(-0.35, 0, v, -2.4, -1.3, v * 1.1).seg(0.35, 0, v, 2.8, -1.6, v * 1.16);
        K.fine().col(AC.detail, 0.7).seg(1.5, -0.8, -5.4, 1.5, -0.8, 5.4);
        for (let v = -4.5; v <= 4.51; v += 0.75) K.seg(-0.35, 0, v, -2.4, -1.3, v * 1.1);
        //  Tràn xả lũ bậc nước ở đầu đập.
        K.coarse().col(AC.line).seg(0.35, 0, 3.6, 4.5, -1.8, 3.6).seg(0.35, 0, 4.6, 4.5, -1.8, 4.6);
        K.fine().col(AC.water, 0.85);
        for (let i = 0; i < 8; i++) { const u = 0.35 + i * 0.52, y = -i * 0.225; K.seg(u, y, 3.6, u, y, 4.6).seg(u, y, 4.1, u + 0.52, y - 0.225, 4.1); }
        //  Tháp lấy nước + cầu công tác.
        K.coarse().col(AC.line).cyl(-4.2, -1.5, 0.45, -1.4, 2.2, 12, 4).seg(-0.35, 0.2, -1.4, -3.75, 0.2, -1.4).seg(-0.35, 0.2, -1.65, -3.75, 0.2, -1.65);
        K.col(AC.roof).pyramid(-4.2, -1.5, 0.9, 0.9, 0.8, 0.35, 0.05);
        //  Trạm bơm hạ lưu + đường ống.
        const pu = 4.6, pv = -2.4, pg = footY(...localPx(dam, yaw, pu, pv), 2) - cy;
        K.coarse().col(AC.line).box(pu, pv, 1.8, 1.3, pg, 0.9).col(AC.roof).gable(pu, pv, 1.8, 1.3, pg + 0.9, 0.5);
        K.col(AC.line);
        for (const v of [-0.25, 0.25]) K.seg(-0.4, -0.6, pv + v, pu - 0.9, pg + 0.3, pv + v).seg(pu + 0.9, pg + 0.3, pv + v, pu + 6, pg + 0.25, pv + v * 1.4);
        K.fine().col(AC.detail, 0.8);
        for (let u = pu + 1.6; u < pu + 6; u += 1.0) K.seg(u, pg, pv - 0.45, u, pg + 0.3, pv - 0.45).seg(u, pg, pv + 0.45, u, pg + 0.3, pv + 0.45);
    }

    /*  NHÀ MÁY NƯỚC — bể lắng ly tâm (cầu gạt quay), dãy bể lọc chia ngăn, bể
        chứa nước sạch có ống thông hơi, nhà điều hành, bồn hoá chất, đường ống.
        Bản quy hoạch (Dương Đông 2) vẽ cùng sơ đồ bằng nét đứt. */
    function waterPlant(K, s, plan) {
        const base = footY(s.px, s.py, 5);
        K.frame(s.x, base, s.z, 0).dashed(plan ? 0.35 : 0);
        const a = plan ? 0.8 : 1;
        K.coarse().col(AC.line, a);
        for (const v of [-1.9, 1.9]) K.cyl(-3.2, v, 1.3, 0, 0.45, 24, 4);
        K.box(1.0, -1.6, 4.2, 2.4, 0, 0.45).box(1.0, 1.9, 3, 2, 0, 0.55).box(4.6, 0, 2, 1.3, 0, 0.8);
        K.col(AC.roof, a).hip(4.6, 0, 2, 1.3, 0.8, 0.5);
        K.fine().col(AC.detail, 0.8 * a);
        for (const v of [-1.9, 1.9]) {
            K.ell(-3.2, 0.3, v, 0.9, 0.9, 18).ell(-3.2, 0.5, v, 0.15, 0.15, 6);
            K.seg(-3.2 - 1.3, 0.5, v, -3.2 + 1.3, 0.5, v);
        }
        for (let i = 1; i < 3; i++) K.seg(1.0 - 2.1 + i * 1.4, 0.45, -2.8, 1.0 - 2.1 + i * 1.4, 0.45, -0.4);
        K.seg(-1.1, 0.45, -1.6, 3.1, 0.45, -1.6);
        for (const u of [0.2, 1.0, 1.8]) K.seg(u, 0.55, 1.9, u, 0.85, 1.9);
        for (let i = 0; i < 3; i++) K.cyl(6.2, -1.0 + i * 0.6, 0.22, 0, 0.6, 8, 2);
        K.col(AC.water, 0.8 * a).seg(-1.9, 0.25, -1.9, -1.1, 0.25, -1.6).seg(-1.9, 0.25, 1.9, -0.5, 0.25, 1.9).seg(3.1, 0.25, -1.6, 3.6, 0.25, -0.4);
        K.dashed(0);
    }

    /*  HỒ QUY HOẠCH (Cửa Cạn, Suối Lớn) — nét đứt: tuyến đập chặn và đường viền
        mặt hồ dự kiến phía thượng lưu (phía xa biển). */
    function plannedLake(K, s) {
        const yaw = dirTo(s.px, s.py, false);
        const base = footY(s.px, s.py, 2);
        K.frame(s.x, base, s.z, yaw).dashed(0.4).coarse().col(AC.water, 0.9);
        K.ell(-5.5, 0.1, 0, 5, 3.6, 36);
        K.col(AC.line, 0.85).seg(0, 0.4, -3.8, 0, 0.4, 3.8).seg(0.8, -0.2, -4.2, 0.8, -0.2, 4.2);
        K.dashed(0);
    }

    /*  NHÀ MÁY RÁC — Đồng Cây Sao (cơ sở tạm đang chạy): xưởng phân loại mái răng
        cưa, nhà xưởng phụ, luống ủ phân, trạm cân, hàng rào. Bãi Bổn (chưa vận
        hành): lò đốt, nhà tiếp nhận, ống khói có sàn thao tác, hệ xử lý khí,
        băng tải — nét mờ hơn vì nhà máy chưa chạy. */
    function wastePlant(K, s, kind) {
        const base = footY(s.px, s.py, 5);
        K.frame(s.x, base, s.z, dirTo(s.px, s.py, false));
        if (kind === 'sort') {
            K.coarse().col(AC.line).box(0, 0, 6, 2.6, 0, 1.0);
            for (let i = 0; i < 4; i++) { const u0 = -3 + i * 1.5; K.seg(u0, 1.0, -1.3, u0 + 1.2, 1.7, -1.3).seg(u0 + 1.2, 1.7, -1.3, u0 + 1.5, 1.0, -1.3).seg(u0, 1.0, 1.3, u0 + 1.2, 1.7, 1.3).seg(u0 + 1.2, 1.7, 1.3, u0 + 1.5, 1.0, 1.3).seg(u0 + 1.2, 1.7, -1.3, u0 + 1.2, 1.7, 1.3); }
            K.box(-1.2, 3.4, 3, 2, 0, 0.8).col(AC.roof).gable(-1.2, 3.4, 3, 2, 0.8, 0.5);
            K.fine().col(AC.detail, 0.75);
            for (let i = 0; i < 5; i++) { const v = -4.6 + i * 0.75; K.seg(-2.5, 0.35, v, 2.5, 0.35, v).seg(-2.5, 0, v - 0.3, -2.5, 0.35, v).seg(-2.5, 0.35, v, -2.5, 0, v + 0.3); }
            K.box(4.4, 2.6, 0.6, 0.6, 0, 0.5).rect(3.2, 3.2, 4.8, 3.8, 0.04);
            K.dashed(0.3).rect(-5.5, -5.5, 5.8, 5.2, 0.5).dashed(0);
        } else {
            const a = 0.75;
            K.coarse().col(AC.line, a).box(0, 0, 4, 3, 0, 2.2).gable(0, 0, 4, 3, 2.2, 0.5, 0.05).box(-3.6, 0, 3, 2.4, 0, 1.4);
            K.cyl(2.8, -2.0, 0.28, 0, 5.6, 12, 4);
            K.fine().col(AC.detail, 0.7 * a);
            for (const y of [2.2, 3.8, 5.0]) K.ell(2.8, y, -2.0, 0.55, 0.55, 12);
            K.cyl(2.6, 1.6, 0.5, 0, 1.6, 12, 4).cyl(3.8, 1.6, 0.35, 0, 1.2, 10, 2);
            K.seg(-2.1, 0.2, 0, -0.5, 1.8, 0).seg(-2.1, 0.2, 0.4, -0.5, 1.8, 0.4);
            K.mullions(0, 0, 4, 3, 0, 2.2, 0.5);
            K.dashed(0.3).rect(-6, -4.5, 5.2, 4.5, 0.5).dashed(0);
        }
    }

    /* ════════ SINH HOẠT (Du lịch) ════════ */

    /*  TÀU THUYỀN — rải trên vùng nước NÔNG (2–30 m, lấy từ lớp độ sâu): thuyền
        đánh cá (một phần có dàn đèn câu mực), ca-nô có vệt sóng đuôi dài, thuyền
        buồm, thúng chai. Mỗi chiếc giữ đúng 24 nét trong bể; nét thừa dồn xuống
        đáy. Vệt sóng đuôi dài theo tốc độ. */
    function vessels(A) {
        /*  Cả VÒNG CHẠY phải nằm trên nước, không chỉ tâm vòng: bản trước chỉ thử
            tâm (nước nông 2–30 m) rồi cho chạy vòng bán kính tới 26 đơn vị (~1 km)
            — thuyền ở sát bờ cứ thế chạy xuyên qua đất liền. Thử 16 điểm trên vòng,
            hụt thì thu bán kính lại, ba lần không được thì bỏ chỗ đó. */
        const kindOf = i => i < 14 ? 'fish' : i < 21 ? 'speed' : i < 28 ? 'sail' : 'basket';
        const wet = (x, z, r) => {
            for (let k = 0; k < 16; k++) {
                const t = k / 16 * Math.PI * 2, px = x + CX + Math.cos(t) * r, py = z + CZ + Math.sin(t) * r;
                if (isLand(px, py) || depthAt(px, py) < 1.5) return false;
            }
            return true;
        };
        const spots = [];
        _sd = 20260810;
        for (let i = 0; i < 12000 && spots.length < 34; i++) {
            const x = rnd(-500, 500), z = rnd(-1010, 1010), d = depthAt(x + CX, z + CZ);
            if (d <= 2 || d >= 30 || isLand(x + CX, z + CZ)) continue;
            let r = rnd(6, 26) * (kindOf(spots.length) === 'basket' ? 0.3 : 1);
            for (let k = 0; k < 3 && !wet(x, z, r); k++) r *= 0.6;
            if (wet(x, z, r)) spots.push([x, z, r]);
        }
        const kinds = spots.map((_, i) => kindOf(i));
        const V = spots.map(([x, z, r], i) => ({
            cx: x, cz: z, k: kinds[i], squid: kinds[i] === 'fish' && i % 3 === 0,
            r, a: rnd(0, 6.28), wake: null,
            sp: (kinds[i] === 'speed' ? rnd(0.18, 0.3) : kinds[i] === 'basket' ? rnd(0.02, 0.05) : rnd(0.05, 0.14)) * (rnd(0, 1) < 0.5 ? -1 : 1),
            s: kinds[i] === 'fish' ? rnd(1.3, 1.9) : kinds[i] === 'speed' ? 1.3 : kinds[i] === 'sail' ? 1.6 : 1.4
        }));
        const PER = 28, WAKE = 23;
        const P = linePool(V.length * PER, i => {
            const v = V[(i / PER) | 0], k = i % PER;
            if (k >= WAKE) return rgba(AC.wake, 0.75);
            if (v.squid && k >= SHP_FISH.length / 6) return rgba(AC.warm);
            return rgba(v.k === 'sail' && k >= 6 ? AC.detail : AC.line, 0.95);
        });
        A.group.add(P.mesh);
        const SHP = { fish: SHP_FISH, speed: SHP_SPEED, sail: SHP_SAIL, basket: SHP_BASKET };
        for (const v of V) {
            v.shp = SHP[v.k];
            if (v.k === 'basket') continue;
            const w = Math.min(3.2, Math.abs(v.sp * v.r) * 0.9 + 0.4);
            v.wake = [-0.95, 0, -0.2, -0.95 - w, 0, -0.2 - w * 0.45, -0.95, 0, 0.2, -0.95 - w, 0, 0.2 + w * 0.45,
                -0.95, 0, -0.05, -0.95 - w * 0.6, 0, -0.12, -0.95, 0, 0.05, -0.95 - w * 0.6, 0, 0.12];
        }
        A.upd.push(tt => {
            const y = SEA_Y() + 0.02;
            pen.at(P.arr, 0);
            for (let i = 0; i < V.length; i++) {
                const v = V[i], a = v.a + tt * v.sp, dir = v.sp > 0 ? 1 : -1, base = i * PER * 6;
                const x = v.cx + Math.cos(a) * v.r, z = v.cz + Math.sin(a) * v.r;
                pen.o = base;
                pen.frame(x, y, z, -Math.sin(a) * dir, Math.cos(a) * dir, v.s);
                pen.shape(v.shp);
                if (v.squid) pen.shape(SHP_SQUID);
                pen.hide(base + WAKE * 6);
                if (v.wake) pen.shape(v.wake);
                pen.hide(base + PER * 6);
            }
            P.mesh.geometry.attributes.position.needsUpdate = true;
        });
    }

    /*  ĐÀN CHIM — đội hình chữ V thật (chim đầu đàn, hai cánh lùi chéo), mỗi cánh
        hai đốt (khuỷu & mút cánh) vỗ lệch pha nhau. */
    function birdFlocks(A) {
        const NF = 5, PER = 9, F = [];
        _sd = 4242;
        for (let i = 0; i < NF; i++)
            F.push({ cx: rnd(-360, 360), cz: rnd(-800, 800), r: rnd(70, 190), y: rnd(28, 46), a: rnd(0, 6.28), sp: rnd(0.05, 0.13) });
        const P = linePool(NF * PER * 4, () => rgba(0x4a4636, 0.6));
        A.group.add(P.mesh);
        A.upd.push(tt => {
            const a = P.arr;
            let o = 0;
            for (let fi = 0; fi < NF; fi++) {
                const f = F[fi], an = f.a + tt * f.sp, bx = f.cx + Math.cos(an) * f.r, bz = f.cz + Math.sin(an) * f.r;
                const hx = -Math.sin(an), hz = Math.cos(an), px = -hz, pz = hx;
                for (let b = 0; b < PER; b++) {
                    const rank = (b + 1) >> 1, side = b === 0 ? 0 : b % 2 ? -1 : 1;
                    const ox = bx - hx * rank * 5.5 + px * side * rank * 4.5, oz = bz - hz * rank * 5.5 + pz * side * rank * 4.5;
                    const oy = f.y + Math.sin(tt * 0.9 + b) * 0.6, ph = tt * 3.4 + b * 0.8;
                    const e = Math.sin(ph) * 0.7, t = Math.sin(ph - 0.6) * 1.5, w1 = 1.3, w2 = 2.6;
                    for (let sd = -1; sd <= 1; sd += 2) {
                        const ex = ox + px * sd * w1, ez = oz + pz * sd * w1, ey = oy + e;
                        a[o++] = ox; a[o++] = oy; a[o++] = oz; a[o++] = ex; a[o++] = ey; a[o++] = ez;
                        a[o++] = ex; a[o++] = ey; a[o++] = ez; a[o++] = ox + px * sd * w2 - hx * 0.5; a[o++] = oy + t; a[o++] = oz + pz * sd * w2 - hz * 0.5;
                    }
                }
            }
            P.mesh.geometry.attributes.position.needsUpdate = true;
        });
    }

    /*  Dò về đất liền gần nhất — lưới an toàn cho toạ độ chép từ bản đồ khác. */
    function snapLand(px, py, maxR) {
        if (eleAt(px, py) > 0.5) return [px, py];
        for (let r = 2; r <= (maxR || 60); r += 2)
            for (let a = 0; a < 24; a++) {
                const t = a / 24 * 6.283, x = px + Math.cos(t) * r, y = py + Math.sin(t) * r;
                if (eleAt(x, y) > 0.5) return [x, y];
            }
        return [px, py];
    }
    let _sd = 20260810;
    const rnd = (a, b) => { _sd = (_sd * 1664525 + 1013904223) >>> 0; return a + (_sd / 4294967296) * (b - a); };

    /*  Chép mảng nháp sang mảng định kiểu rồi XOÁ mảng nháp ngay tại chỗ. Không
        thể trông vào việc bộ nét `K` bị bỏ đi: hàm nào trong một công trình có hàm
        con nhắc tới `K` thì V8 đặt `K` vào ngữ cảnh chung của công trình đó — và
        hàm cập nhật hoạt cảnh (sống suốt đời trang) dùng chính ngữ cảnh ấy. Ảnh
        chụp heap đo được ~1 MB mảng nháp bị giữ lại như thế trước khi có dòng này. */
    function kitMeshes(K) {
        return [0, 1].map(l => {
            const b = K.buf[l];
            K.buf[l] = { p: [], c: [] };
            if (!b.p.length) return null;
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(b.p), 3));
            g.setAttribute('rgba', new THREE.BufferAttribute(new Uint8Array(b.c), 4, true));
            S.geoBytes += geoBytes(g);
            S.artSegs += b.p.length / 6;
            b.p.length = b.c.length = 0;
            return new THREE.LineSegments(g, artMat);
        });
    }

    /* ── lắp ráp ba lớp ───────────────────────────────────────────────────── */
    const ART = {};
    function disposeArt() {
        for (const k in ART) {
            const A = ART[k];
            A.group.traverse(o => { if (o.geometry) o.geometry.dispose(); });
            scene.remove(A.group);
            delete ART[k];
        }
    }

        const mk = key => {

    /* ── 5d · ghim CSS2D ──────────────────────────────────────────────────
       CSS2DObject gỡ thẻ DOM của nó khi chính nó nhận sự kiện 'removed'. Gọi
       scene.remove(nhóm) thì sự kiện bắn vào NHÓM, các ghim con không nghe thấy
       — nên phải tự gỡ từng thẻ, không thì mỗi lần dựng lại là 41 <div> nằm lại. */
    let LABELS = [];                           // nhãn theo thứ tự ưu tiên khi chống chồng
    function disposePins() {
        if (!pins) return;
        for (const o of pins.children) if (o.element) o.element.remove();
        pins.clear();
        scene.remove(pins);
        pins = null;
        LABELS = [];
    }

    const GRP_OF = c => ['airport', 'port', 'cable'].includes(c) ? 'giaothong'
        : ['tour', 'park', 'apec'].includes(c) ? 'dulich' : 'hatang';
    const CAT_COLOR = {
        water: '#1b75bc', lake: '#008b8b', waste: '#2e7d32', airport: '#d97706',
        port: '#7b5ea7', cable: '#c0473a', apec: '#8a5c9e', tour: '#c47a2b', park: '#4a7d3f'
    };

    function buildPins(cube) {
        disposePins();
        pins = new THREE.Group();

        for (const it of INFRA) {
            const el = document.createElement('div');
            el.className = 'pin' + (it.src === 'plan' ? ' plan' : '');
            el.style.setProperty('--pc', CAT_COLOR[it.cat] || '#8d876f');
            /*  Chiều cao cuống lấy từ `len` có sẵn trong dữ liệu (vốn là độ dài
                đường dẫn của bản đồ 2D cũ). Nó khiến các thẻ trong cùng một cụm nằm
                so le theo chiều dọc thay vì chồng khít lên nhau. */
            const stem = Math.round(10 + ((it.len || 110) - 96) * 0.42);
            el.innerHTML = '<div class="pin-stack">'
                + '<div class="pin-card"><span class="pin-em">' + (it.icon || '') + '</span>'
                + '<span>' + it.name + '</span></div>'
                + '<div class="pin-stem" style="height:' + stem + 'px"></div>'
                + '<div class="pin-dot"></div></div>';
            el.querySelector('.pin-card').addEventListener('click', () => showDetail(it, el));

            const [px, py] = lonLatToPx(it.lon, it.lat);
            const o = new CSS2DObject(el);
            o.position.set(px - CX, topOf(Math.max(0, eleAt(px, py)), cube, true), py - CZ);
            o.userData.layer = it.grp === 'tour' ? 'dulich' : GRP_OF(it.cat);
            o.userData.prio = it.major ? 3 : 2;
            o.userData.stem = stem;
            o.userData.it = it;
            pins.add(o);
        }

        for (const sh of SHIELDS) {
            const el = document.createElement('div');
            el.className = 'shield ' + (sh.c === 'primary' ? 'p1' : 'p2');
            el.textContent = sh.r;
            const [px, py] = lonLatToPx(sh.p[0], sh.p[1]);
            const o = new CSS2DObject(el);
            o.position.set(px - CX, topOf(Math.max(0, eleAt(px, py)), cube, true), py - CZ);
            o.userData.layer = 'duong';
            o.userData.prio = sh.c === 'primary' ? 1 : 0;
            pins.add(o);
        }
        //  Sắp xếp ổn định: cùng mức ưu tiên thì giữ thứ tự khai báo.
        LABELS = pins.children.slice().sort((a, b) => b.userData.prio - a.userData.prio);
        scene.add(pins);
    }

    //  Vòng đánh dấu cột khối dưới con trỏ — một thẻ CSS2D dùng lại mãi.
    const ring = new CSS2DObject(Object.assign(document.createElement('div'), { className: 'cursor-ring' }));
    ring.visible = false;
    scene.add(ring);

    /* ── 5e · điều phối dựng ────────────────────────────────────────────── */
    const setBar = (pct, txt) => {
        $('#bar > i').style.width = pct + '%';
        if (txt) $('#loadTxt').textContent = txt;
    };
    async function rebuild() {
        if (S.busy) return;
        S.busy = true;
        $('#loading').classList.add('on');
        setBar(40, 'Đang nướng chiếu sáng và dựng voxel…');
        await yieldUI(); await yieldUI();       // để lớp phủ kịp vẽ ra màn hình

        try {
            disposeVoxels();
            const { n, hiE } = buildVoxels(S.step);
            setBar(80, 'Đang dựng đáy biển, đường và điểm mốc…');
            await yieldUI();

            buildSeabed();
            buildSea();
            //  Đường, ghim và công trình bám vào cao độ của cạnh khối cố định —
            //  dựng đúng một lần.
            if (!roads) buildRoads(S.step);
            buildArt();
            artList = ARTL();
            if (!pins) buildPins(S.step);
            applyLayers();
            if (first) { goHome(0); first = false; }

            $('#brandSub').textContent = nf(n) + ' cột · khối ' + Math.round(S.step * CELL_M)
                + ' m · đỉnh ' + nf(hiE) + ' m (' + S.layers + ' tầng)';
            setBar(100);
            invalidate();
        } catch (e) {
            console.error(e);
            fail('Dựng mô hình thất bại: ' + e.message);
        } finally {
            S.busy = false;
            $('#loading').classList.remove('on');
            setBar(0);
        }
    }

    /* ══════════════════════════════════════════════════════════════════════
       6 · MÁY QUAY
       ══════════════════════════════════════════════════════════════════════ */
    /*  Phương vị 0 — nhìn thẳng trục bắc–nam. Máy quay TRỰC GIAO không có phối
        cảnh, nên khung bản đồ hiện ra thẳng thớm đúng như tờ bản đồ giấy. Đảo dài
        1.900 đơn vị mà rộng 880 nên để trục dài dựng đứng cũng là cách tiêu bề
        ngang tiết kiệm nhất — thứ khan hiếm nhất trong khung Wix. */
    const HOME = { theta: 0, phi: 0.02 };
    const TILT = Math.PI * 0.30;
    const DIST = 4000;
    const _sph = new THREE.Spherical();
    const _v = new THREE.Vector3(), _t = new THREE.Vector3(), _q = new THREE.Quaternion();
    let tweens = [], homeZoom = 1;

    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    //  Mọi tween máy quay dùng chung một nhãn: cái mới thay cái cũ, không giằng co.
    function tween(ms, fn) {
        tweens = [];
        if (REDUCED || ms <= 0) { fn(1); invalidate(); return; }
        const t0 = performance.now();
        tweens.push(now => { const k = Math.min(1, (now - t0) / ms); fn(ease(k)); return k >= 1; });
        invalidate();
    }
    const shortest = d => ((d + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
    const angles = () => _sph.setFromVector3(_v.copy(camera.position).sub(controls.target));

    function place(theta, phi, target) {
        _sph.set(DIST, phi, theta);
        camera.position.copy(target).add(_v.setFromSpherical(_sph));
        controls.target.copy(target);
        camera.lookAt(target);
    }

    /*  Khớp khung nhìn vào KHUNG BẢN ĐỒ theo đúng góc cần nhìn: chiếu 8 đỉnh hộp
        về không gian máy quay rồi đo bề ngang, bề cao thật trên màn hình. Trừ luôn
        phần bị hai bảng bên và cụm đáy che, rồi dời tâm về giữa khoảng trống còn
        lại — không thì trong khung Wix hẹp, nửa đảo nằm khuất dưới bảng chú giải.
        Chỉ ĐO: đặt tạm máy quay, đo, rồi trả nguyên trạng — để còn bay tới mượt. */
    const _m = new THREE.Matrix4(), _right = new THREE.Vector3(), _up = new THREE.Vector3();
    function fitView(theta, phi) {
        const w = container.clientWidth || 1, h = container.clientHeight || 1;
        const keepP = camera.position.clone(), keepQ = camera.quaternion.clone(), keepT = controls.target.clone();
        place(theta, phi, _t.set(0, 0, 0));
        camera.updateMatrixWorld();

        const inv = _m.copy(camera.matrixWorld).invert();
        const top = BOX.topY;
        let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
        for (let i = 0; i < 8; i++) {
            _v.set(i & 1 ? CX : -CX, i & 2 ? top : 0, i & 4 ? CZ : -CZ).applyMatrix4(inv);
            if (_v.x < x0) x0 = _v.x; if (_v.x > x1) x1 = _v.x;
            if (_v.y < y0) y0 = _v.y; if (_v.y > y1) y1 = _v.y;
        }

        /*  Mỗi bảng HUD có thể "ăn" vào lề cạnh (nằm bên trái/phải bản đồ) HOẶC vào
            lề trên/dưới (bản đồ nằm hẳn dưới/trên nó). Trên màn rộng thì ăn lề cạnh
            gần như không tốn gì vì khung bản đồ vốn dựng đứng; trên điện thoại thì
            ngược lại — bảng chú giải mà chiếm lề trái là bản đồ còn mỗi khe hẹp.
            Thử đủ các tổ hợp, giữ tổ hợp cho bản đồ to nhất. */
        const seen = el => { const s = getComputedStyle(el); return s.display !== 'none' ? el.getBoundingClientRect() : null; };
        const cr = container.getBoundingClientRect();
        const bl = seen($('.hud-tl')), br = seen($('.hud-tr')), bt = seen($('.tools')), bb = seen($('.hud-bc'));
        const bs = seen($('.hud-bl'));
        //  Cụm đáy (thanh lớp + dòng số liệu) luôn chừa, cộng chỗ cho nhãn kinh độ ở mép nam.
        const gb0 = bb ? cr.bottom - bb.top + 22 : 62;
        const opts = [
            bl ? [{ l: bl.right - cr.left + 10 }, { t: bl.bottom - cr.top + 10 }] : [{}],
            br ? [{ r: cr.right - br.left + 10 }, { t: br.bottom - cr.top + 10 }] : [{}],
            bt ? [{ r: cr.right - bt.left + 10 }, { b: cr.bottom - bt.top + 10 }] : [{}],
            bs ? [{ l: bs.right - cr.left + 10 }, { b: cr.bottom - bs.top + 22 }] : [{}]
        ];
        let zoom = 0, gl = 12, gr = 12, gt = 12, gb = gb0;
        for (const a of opts[0]) for (const b of opts[1]) for (const c of opts[2]) for (const d of opts[3]) {
            const L = Math.max(12, a.l || 0, d.l || 0), R = Math.max(12, b.r || 0, c.r || 0);
            const T = Math.max(12, a.t || 0, b.t || 0), B = Math.max(gb0, c.b || 0, d.b || 0);
            const uw = Math.max(140, w - L - R), uh = Math.max(140, h - T - B);
            const z = Math.min(FRUSTUM * (w / h) * 2 * (uw / w) / (x1 - x0), FRUSTUM * 2 * (uh / h) / (y1 - y0)) / 1.03;
            if (z > zoom) { zoom = z; gl = L; gr = R; gt = T; gb = B; }
        }
        const perPx = (FRUSTUM / zoom * 2) / h;
        const wantX = (gl - gr) / 2 * perPx, wantY = (gb - gt) / 2 * perPx;
        _right.setFromMatrixColumn(camera.matrixWorld, 0);
        _up.setFromMatrixColumn(camera.matrixWorld, 1);
        const target = _right.clone().multiplyScalar((x0 + x1) / 2 - wantX)
            .add(_up.clone().multiplyScalar((y0 + y1) / 2 - wantY));

        camera.position.copy(keepP); camera.quaternion.copy(keepQ); controls.target.copy(keepT);
        camera.updateMatrixWorld();
        return { zoom, target };
    }

    //  Bay tới góc (theta, phi), khớp khung toàn đảo. ms = 0 là đặt thẳng.
    function flyView(theta, phi, ms) {
        const fit = fitView(theta, phi);
        angles();
        const th0 = _sph.theta, ph0 = _sph.phi, dth = shortest(theta - th0);
        const t0 = controls.target.clone(), z0 = camera.zoom;
        tween(ms, k => {
            controls.target.lerpVectors(t0, fit.target, k);
            camera.zoom = z0 * Math.pow(fit.zoom / z0, k);
            camera.updateProjectionMatrix();
            _sph.set(DIST, ph0 + (phi - ph0) * k, th0 + dth * k);
            camera.position.copy(controls.target).add(_v.setFromSpherical(_sph));
            camera.lookAt(controls.target);
        });
        return fit;
    }

    function goHome(ms) {
        hideDetail();
        if (S.spin) toggleSpin();
        const fit = flyView(HOME.theta, HOME.phi, ms);
        homeZoom = fit.zoom;
        //  Giới hạn phóng theo khung toàn đảo: thu nhỏ quá thì đảo thành một chấm,
        //  phóng quá thì một khối 38 m chiếm cả màn hình.
        controls.minZoom = homeZoom * 0.55;
        controls.maxZoom = homeZoom * 60;
        S.atHome = true;
        setTiltButtons(false);
    }

    function orbitBy(d) {
        angles();
        const from = _sph.theta, phi = _sph.phi;
        S.atHome = false;
        tween(420, k => {
            _sph.set(DIST, phi, from + d * k);
            camera.position.copy(controls.target).add(_v.setFromSpherical(_sph));
            camera.lookAt(controls.target);
        });
    }

    function flyTo(x, z, zoom) {
        const t0 = controls.target.clone(), z0 = camera.zoom;
        const z1 = Math.max(controls.minZoom, Math.min(controls.maxZoom, zoom));
        angles();
        const keep = _sph.clone();
        S.atHome = false;
        tween(620, k => {
            controls.target.set(t0.x + (x - t0.x) * k, t0.y * (1 - k), t0.z + (z - t0.z) * k);
            camera.position.copy(controls.target).add(_v.setFromSpherical(keep));
            camera.zoom = z0 * Math.pow(z1 / z0, k);
            camera.updateProjectionMatrix();
            camera.lookAt(controls.target);
        });
    }

    function toAngles(theta, phi, ms) {
        angles();
        const t0 = _sph.theta, p0 = _sph.phi, dth = shortest(theta - t0);
        tween(ms, k => {
            _sph.set(DIST, p0 + (phi - p0) * k, t0 + dth * k);
            camera.position.copy(controls.target).add(_v.setFromSpherical(_sph));
            camera.lookAt(controls.target);
        });
    }

    function zoomBy(f) {
        const z0 = camera.zoom, z1 = Math.max(controls.minZoom, Math.min(controls.maxZoom, z0 * f));
        S.atHome = false;
        tween(260, k => { camera.zoom = z0 * Math.pow(z1 / z0, k); camera.updateProjectionMatrix(); });
    }

    /*  Mặc định nhìn thẳng xuống; nút này lật giữa nhìn xuống và góc chếch. Nhãn
        nút ghi HÀNH ĐỘNG sẽ làm ("Nghiêng 3D" / "Nhìn xuống"), không ghi trạng thái
        hiện tại. Đang xem toàn đảo thì khớp lại khung theo góc mới (nghiêng làm khung
        ngắn lại, không khớp thì bỏ trống cả nửa màn hình); đang phóng gần một chỗ
        thì giữ nguyên chỗ đó, chỉ đổi góc. */
    function toggleTilt() {
        angles();
        const flat = _sph.phi < 0.15, phi = flat ? TILT : HOME.phi;
        if (S.atHome || Math.abs(camera.zoom / homeZoom - 1) < 0.2) { flyView(_sph.theta, phi, 700); S.atHome = true; }
        else toAngles(_sph.theta, phi, 700);
        setTiltButtons(flat);
    }
    function setTiltButtons(tilted) {
        for (const b of document.querySelectorAll('[data-tilt]')) {
            b.querySelector('use').setAttribute('href', tilted ? '#i-topology-ring-2' : '#i-mountain');
            const s = b.querySelector('span');
            if (s) s.textContent = tilted ? 'Nhìn xuống' : 'Nghiêng 3D';
            b.classList.toggle('on', tilted);
        }
    }

    function toggleSpin() {
        S.spin = !S.spin;
        controls.autoRotate = S.spin;
        const b = $('#btnSpin');
        b.classList.toggle('on', S.spin);
        b.querySelector('use').setAttribute('href', S.spin ? '#i-pause' : '#i-play');
        b.querySelector('span').textContent = S.spin ? 'Dừng xoay' : 'Tự xoay';
        if (S.spin) S.atHome = false;
        invalidate();
    }

    //  Không cho kéo bản đồ trôi khỏi khung: tâm xoay kẹp trong mép khung dữ liệu.
    function clampTarget() {
        const t = controls.target;
        const x = Math.max(-CX, Math.min(CX, t.x)), z = Math.max(-CZ, Math.min(CZ, t.z));
        const y = Math.max(-20, Math.min(BOX.topY + 20, t.y));
        if (x !== t.x || y !== t.y || z !== t.z) {
            camera.position.x += x - t.x; camera.position.y += y - t.y; camera.position.z += z - t.z;
            t.set(x, y, z);
        }
    }

    /* ══════════════════════════════════════════════════════════════════════
       7 · HUD
       ══════════════════════════════════════════════════════════════════════ */
    /*  Mở thì để height:auto, gập thì 0. Chỉ khoá thành số pixel trong đúng một
        khung hình để phép chuyển tiếp có điểm đầu và điểm cuối cụ thể. */
    function initGroup(el, onToggle) {
        const head = el.querySelector('.grp-h'), body = el.querySelector('.grp-b');
        body.style.height = el.classList.contains('collapsed') ? '0px' : 'auto';
        body.addEventListener('transitionend', e => {
            if (e.propertyName === 'height' && !el.classList.contains('collapsed')) body.style.height = 'auto';
        });
        head.addEventListener('click', () => {
            const open = el.classList.contains('collapsed');
            body.style.height = body.scrollHeight + 'px';
            requestAnimationFrame(() => {
                if (open) { el.classList.remove('collapsed'); body.style.height = body.scrollHeight + 'px'; }
                else { body.style.height = '0px'; el.classList.add('collapsed'); }
                head.setAttribute('aria-expanded', open ? 'true' : 'false');
                if (onToggle) onToggle(open);
            });
        });
    }

    // 7a · chú giải địa mạo — bấm để soi riêng một dạng
    const legendBox = $('#legendItems');
    function selectLandform(i) {
        S.sel = i;
        U.sel.value = S.sel;
        [...legendBox.children].forEach((c, k) => {
            c.classList.toggle('on', k === S.sel);

    }
    LANDFORM_LEGEND.forEach(([, name, pct], i) => {
        const row = document.createElement('button');
        row.type = 'button';

        row.setAttribute('aria-pressed', 'false');

        row.addEventListener('click', () => selectLandform(S.sel === i ? -1 : i));
        legendBox.appendChild(row);
    });
    $('#nLegend').textContent = LANDFORM_LEGEND.length;

    // 7b · điểm xem
    const VIEWS = [
        ['Bãi Dài · VinWonders', 'Tây bắc · Grand World', 103.84897, 10.33447],
        ['Mũi Gành Dầu', 'Cực tây bắc', 103.85569, 10.37605],
        ['Bãi Thơm', 'Cực đông bắc', 104.04834, 10.40845],
        ['Rạch Vẹm', 'Làng chài sao biển', 103.94166, 10.38602],
        ['Suối Tranh', 'Thác giữa rừng', 104.01534, 10.18378],
        ['Bãi Trường', 'Long Beach · hoàng hôn', 103.97370, 10.13802],
        ['Cửa Cạn', 'Cửa sông', 103.92205, 10.27799],
        ['Dãy Hàm Ninh', 'Núi Đá Bạc 448 m', 104.06978, 10.25450]
    ];
    const viewBox = $('#viewList');
    for (const [name, sub, lon, lat] of VIEWS) {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'lm';
        el.innerHTML = '<svg class="ic"><use href="#i-map-pin"/></svg><b>' + name
            + '<small>' + sub + '</small></b>';
        el.addEventListener('click', () => {
            const [px, py] = lonLatToPx(lon, lat);
            flyTo(px - CX, py - CZ, homeZoom * 3.6);
        });
