    }
    $('#nViews').textContent = VIEWS.length;

    // 7c · thanh lớp thông tin
    function applyLayers() {
        if (pins) for (const o of pins.children) o.visible = !!S.show[o.userData.layer];
        if (roads) roads.visible = S.show.duong;
        if (ferries) ferries.visible = S.show.duong;
        //  Công trình line-art đi cùng ghim của lớp mình — và chỉ lớp nào đang bật
        //  thì hoạt cảnh của lớp đó mới chạy; còn lại vẫn giữ nếp vẽ-khi-cần.
        for (const k in ART) ART[k].group.visible = !!S.show[k];
        invalidate();
    }

    const LAYERS = [
        ['hatang', 'building-community', 'Hạ tầng'],
        ['dulich', 'map-pin', 'Du lịch'],
        ['giaothong', 'plane-departure', 'Giao thông'],
        ['duong', 'road', 'Đường']
    ];
    const bar = $('#layerBar');
    for (const [key, icon, text] of LAYERS) {
        const n = key === 'duong' ? SHIELDS.length
            : INFRA.filter(i => (i.grp === 'tour' ? 'dulich' : GRP_OF(i.cat)) === key).length;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn' + (S.show[key] ? ' on' : '');
        b.setAttribute('aria-pressed', S.show[key] ? 'true' : 'false');
        b.innerHTML = '<svg class="ic"><use href="#i-' + icon + '"/></svg>' + text
            + '<span class="grp-n">' + n + '</span>';
        b.addEventListener('click', () => {
            S.show[key] = !S.show[key];
            b.classList.toggle('on', S.show[key]);
            b.setAttribute('aria-pressed', S.show[key] ? 'true' : 'false');
            if (!S.show[key] && S.focus && pinLayerOf(S.focus) === key) hideDetail();
            applyLayers();
        });
        bar.appendChild(b);
    }
    const pinOf = el => pins ? pins.children.find(p => p.element === el) || null : null;
    const pinLayerOf = el => { const o = pinOf(el); return o ? o.userData.layer : null; };

    // 7d · thẻ chi tiết điểm mốc — thêm cao độ & toạ độ của chính điểm đó
    const SRC_TXT = { osm: 'toạ độ đo từ OSM', approx: 'vị trí gần đúng', plan: 'theo quy hoạch' };
    const detail = $('#detail');
    function showDetail(it, el) {
        if (S.focus && S.focus !== el) S.focus.querySelector('.pin-card').classList.remove('sel');
        S.focus = el;
        S.focusObj = pinOf(el);
        el.querySelector('.pin-card').classList.add('sel');
        const [px, py] = lonLatToPx(it.lon, it.lat);
        const e = Math.max(0, Math.round(eleLerp(px, py)));
        detail.innerHTML = '<div class="dt"><span>' + (it.icon || '') + '</span>' + it.name
            + '<button type="button" aria-label="Đóng">×</button></div>'
            + '<div class="ds">' + it.sub + '</div>'
            + '<div class="dm">cao độ ' + nf(e) + ' m · ' + fmtLL(it.lat, it.lon) + '</div>'
            + '<span class="src ' + it.src + '">' + (SRC_TXT[it.src] || it.src) + '</span>';
        detail.querySelector('button').addEventListener('click', hideDetail);
        detail.classList.add('on');
        flyTo(px - CX, py - CZ, Math.max(camera.zoom, homeZoom * 4));
        invalidate();
    }
    function hideDetail() {
        if (S.focus) S.focus.querySelector('.pin-card').classList.remove('sel');
        S.focus = S.focusObj = null;
        detail.classList.remove('on');
        detail.innerHTML = '';
        invalidate();
    }

    // 7e · hiển thị: mặt biển, đổ bóng
    const btnSea = $('#btnSea');
    btnSea.classList.toggle('on', S.sea);
    btnSea.addEventListener('click', () => {
        S.sea = !S.sea;
        btnSea.classList.toggle('on', S.sea);
        if (sea) sea.visible = S.sea;          // mặt nước, lưới toạ độ và khung
        if (seabed) seabed.visible = S.sea;    // và cả lớp đáy biển bên dưới
        invalidate();
    });
    //  Bật/tắt chiếu sáng nướng sẵn: chỉ là một uniform, không dựng lại gì —
    //  tắt đi để so với màu cao độ trơn.
    const btnRelief = $('#btnRelief');
    btnRelief.classList.toggle('on', S.relief);
    btnRelief.addEventListener('click', () => {
        S.relief = !S.relief;
        btnRelief.classList.toggle('on', S.relief);
        U.relief.value = S.relief ? 1 : 0;
        invalidate();
    });

    // 7f · máy quay & thanh công cụ — mọi nút mang data-act, một bộ nghe chung
    const ACT = {
        rotL: () => orbitBy(-Math.PI / 4),
        rotR: () => orbitBy(Math.PI / 4),
        spin: toggleSpin,
        tilt: toggleTilt,
        home: () => goHome(650),
        zoomIn: () => zoomBy(1.6),
        zoomOut: () => zoomBy(1 / 1.6),
        north: () => { if (S.spin) toggleSpin(); angles(); toAngles(0, _sph.phi, 600); }
    };
    document.addEventListener('click', e => {
        const b = e.target.closest && e.target.closest('[data-act]');
        if (b && ACT[b.dataset.act]) ACT[b.dataset.act]();
    });
    addEventListener('keydown', e => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const k = e.key;
        if (k === 'Escape') { hideDetail(); if (S.sel >= 0) selectLandform(-1); return; }
        const map = { '+': 'zoomIn', '=': 'zoomIn', '-': 'zoomOut', '_': 'zoomOut', n: 'north', N: 'north', h: 'home', H: 'home', t: 'tilt', T: 'tilt' };
        if (map[k]) { ACT[map[k]](); e.preventDefault(); }
    });

    // 7g · thước tỉ lệ & la bàn — chỉ ghi DOM khi giá trị đổi
    const scaleBar = $('#scale i'), scaleTxt = $('#scale span'), compass = $('#compass');
    let lastScale = '', lastBearing = NaN;
    function updateOverlays() {
        const w = VW;
        const mPerPx = (camera.right - camera.left) / camera.zoom / w * M_PER_UNIT;
        const want = mPerPx * 96, p10 = Math.pow(10, Math.floor(Math.log10(want))), r = want / p10;
        const nice = (r >= 5 ? 5 : r >= 2 ? 2 : 1) * p10;
        const key = nice + '|' + (nice / mPerPx).toFixed(1);
        if (key !== lastScale) {
            lastScale = key;
            scaleBar.style.width = (nice / mPerPx).toFixed(1) + 'px';
            scaleTxt.textContent = nice >= 1000 ? nf(nice / 1000) + ' km' : nf(nice) + ' m';
        }
        const th = controls.getAzimuthalAngle();
        if (Math.abs(th - lastBearing) > 0.002) {
            lastBearing = th;
            compass.style.transform = 'rotate(' + th.toFixed(4) + 'rad)';
        }
    }

    /*  7h · CHỐNG CHỒNG NHÃN. Bật Hạ tầng + Du lịch + Đường cùng lúc là ~70 nhãn
        đè lên nhau ở Dương Đông và An Thới. Sau mỗi lần vẽ, xếp nhãn theo ưu tiên
        (ghim đang chọn > ghim chính > ghim phụ > biển số đường chính > phụ), đặt
        lần lượt, cái nào trùng chỗ cái đã đặt thì giấu tạm. Phóng gần ra thì chúng
        tách nhau và tự hiện lại. Kích thước thẻ đo một lần rồi nhớ.
        Chạy NGAY SAU khi CSS2DRenderer vừa ghi transform cho từng nhãn, nên ở đây
        cấm đọc bất cứ thứ gì bắt trình duyệt tính lại bố cục (clientWidth,
        style.display…): cỡ khung lấy từ lần đổi cỡ gần nhất, còn nhãn có nằm
        trong khung nhìn hay không thì tự suy từ toạ độ chiếu. */
    const _p = new THREE.Vector3(), _vp = new THREE.Matrix4();
    const placed = new Float64Array(4 * 160);
    function declutter() {
        const w = VW, h = VH;
        _vp.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
        let np = 0;
        const fo = S.focusObj;
        for (let n = fo ? -1 : 0; n < LABELS.length; n++) {
            const o = n < 0 ? fo : LABELS[n];
            if (n >= 0 && o === fo) continue;
            const el = o.element;
            if (!o.visible) continue;
            let bx = o.userData.box;
            if (!bx) {
                const card = el.classList.contains('pin') ? el.querySelector('.pin-card') : el;
                if (!card.offsetWidth) continue;
                bx = o.userData.box = { w: card.offsetWidth, h: card.offsetHeight,
                    dy: el.classList.contains('pin') ? -(o.userData.stem + 6 + card.offsetHeight / 2) : 0 };
            }
            _p.setFromMatrixPosition(o.matrixWorld).applyMatrix4(_vp);
            if (_p.z < -1 || _p.z > 1) continue;      // ngoài khung — CSS2DRenderer đã giấu
            const sx = (_p.x * 0.5 + 0.5) * w, sy = (-_p.y * 0.5 + 0.5) * h + bx.dy;
            const x0 = sx - bx.w / 2 - 2, x1 = sx + bx.w / 2 + 2, y0 = sy - bx.h / 2 - 1, y1 = sy + bx.h / 2 + 1;
            let hit = false;
            if (o !== fo)
                for (let i = 0; i < np; i += 4)
                    if (x0 < placed[i + 2] && x1 > placed[i] && y0 < placed[i + 3] && y1 > placed[i + 1]) { hit = true; break; }
            if (!hit && np < placed.length) { placed[np] = x0; placed[np + 1] = y0; placed[np + 2] = x1; placed[np + 3] = y1; np += 4; }
            if (o.userData.cull !== hit) { o.userData.cull = hit; el.classList.toggle('cull', hit); }
        }
    }

    /*  7i · ĐỌC SỐ LIỆU DƯỚI CON TRỎ. Dò tia trên lưới cột khối (2D DDA): đi từ
        chỗ tia cắt nóc cao nhất của đảo xuống tới mặt biển, ô nào nóc cột cao hơn
        chỗ tia đi qua thì đó là cột đang nhìn thấy. Máy quay trực giao nên tia
        nào cũng song song — vài chục ô mỗi lần, không cần cây tìm kiếm nào. */
    const readout = $('#readout');
    const HINT = matchMedia('(hover: none)').matches
        ? 'Chạm vào đảo để đọc cao độ · hai ngón để xoay & phóng'
        : 'Kéo để xoay · cuộn để phóng · rê chuột lên đảo để đọc cao độ';
    readout.textContent = HINT;
    const _o = new THREE.Vector3(), _d = new THREE.Vector3();
    let lastPick = '';
    function pick(px, py) {
        _o.set(px / VW * 2 - 1, -py / VH * 2 + 1, 0.5).unproject(camera);
        _d.set(0, 0, -1).transformDirection(camera.matrixWorld);
        if (_d.y > -1e-3) return null;
        const stp = S.step, yTop = BOX.topY + 0.01, yBot = 0;
        const ta = (yTop - _o.y) / _d.y, tb = (yBot - _o.y) / _d.y;
        let x = (_o.x + _d.x * ta + CX) / stp + 0.5, z = (_o.z + _d.z * ta + CZ) / stp + 0.5;
        const dx = (_o.x + _d.x * tb + CX) / stp + 0.5 - x, dz = (_o.z + _d.z * tb + CZ) / stp + 0.5 - z;
        let jx = Math.floor(x), jz = Math.floor(z);
        const sx = dx > 0 ? 1 : -1, sz = dz > 0 ? 1 : -1;
        const ddx = dx ? Math.abs(1 / dx) : Infinity, ddz = dz ? Math.abs(1 / dz) : Infinity;
        let tx = dx ? (sx > 0 ? jx + 1 - x : x - jx) * ddx : Infinity;
        let tz = dz ? (sz > 0 ? jz + 1 - z : z - jz) * ddz : Infinity;
        for (let it = 0; it < 8192; it++) {
            const sOut = Math.min(tx, tz, 1);
            const top = colTopCubes(jx, jz, stp) * stp;
            if (top > 0 && yTop + (yBot - yTop) * sOut <= top) return { land: true, jx, jz, top };
            if (sOut >= 1) break;
            if (tx < tz) { jx += sx; tx += ddx; } else { jz += sz; tz += ddz; }
        }
        const ts = (SEA_Y() - _o.y) / _d.y, wx = _o.x + _d.x * ts, wz = _o.z + _d.z * ts;
        if (Math.abs(wx) > CX || Math.abs(wz) > CZ) return null;
        return { land: false, wx, wz };
    }
    function showPick(hit) {
        if (!hit) {
            if (ring.visible) { ring.visible = false; invalidate(); }
            if (lastPick !== '') { lastPick = ''; readout.textContent = HINT; }
            return;
        }
        let html, key, px, py;
        if (hit.land) {
            px = hit.jx * S.step; py = hit.jz * S.step;
            key = 'L' + hit.jx + ',' + hit.jz;
            ring.position.set(px - CX, hit.top, py - CZ);
            if (key !== lastPick) {
                const c = clsAt(px, py), e = Math.max(0, Math.round(eleLerp(px, py)));
                html = '<i style="background:' + (c < LANDFORM_LEGEND.length ? legendSwatch(c) : '#ccc') + '"></i>'
                    + '<b>' + nf(e) + ' m</b>' + (c < LANDFORM_LEGEND.length ? ' · ' + LANDFORM_LEGEND[c][1] : '')
                    + ' · ' + fmtLL(pxToLat(py), pxToLon(px));
            }
        } else {
            px = hit.wx + CX; py = hit.wz + CZ;
            key = 'S' + Math.round(px / 4) + ',' + Math.round(py / 4);
            ring.position.set(hit.wx, SEA_Y(), hit.wz);
            if (key !== lastPick) {
                const d = Math.round(depthAt(px, py));
                const t = Math.pow(Math.min(1, d / PQBATHY.max), 0.55);
                html = '<i style="background:' + toHex(bathyColor(t)) + '"></i>Biển · sâu <b>~' + nf(d) + ' m</b> · '
                    + fmtLL(pxToLat(py), pxToLon(px));
            }
        }
        if (key !== lastPick) { lastPick = key; readout.innerHTML = html; ring.visible = true; invalidate(); }
    }
    let pickEv = null, pickRaf = 0, downAt = null;
    const canvas = renderer.domElement;
    canvas.addEventListener('pointermove', e => {
        if (e.pointerType !== 'mouse' || e.buttons) return;     // đang kéo xoay thì thôi
        pickEv = e;
        if (!pickRaf) pickRaf = requestAnimationFrame(() => { pickRaf = 0; if (pickEv) showPick(pick(pickEv.offsetX, pickEv.offsetY)); });
    });
    canvas.addEventListener('pointerleave', () => { pickEv = null; showPick(null); });
    //  Màn cảm ứng không có "rê": chạm nhẹ (không kéo) là đọc số liệu tại đó.
    canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; if (e.pointerType === 'mouse') showPick(null); });
    canvas.addEventListener('pointerup', e => {
        if (e.pointerType === 'mouse' || !downAt) return;
        if (Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 8) showPick(pick(e.offsetX, e.offsetY));
        downAt = null;
    });

    // 7j · bảng chẩn đoán — dựng khung một lần, chỉ cập nhật chữ khi nhóm đang mở
    const statsBox = $('#stats');
    const STAT_KEYS = ['Cột khối', 'Hình dựng', 'Tam giác', 'Nét công trình', 'Lượt vẽ', 'Hình học · texture', 'Bộ đệm hình học',
        'Khung vẽ', 'Bộ đệm khung', 'Dữ liệu thường trú', 'JS heap', 'Khung hình'];
    const statCells = STAT_KEYS.map(k => {
        const s = document.createElement('span'), b = document.createElement('b');
        s.textContent = k; statsBox.append(s, b);
        return b;
    });
    const mb = n => (n / 1048576).toFixed(1).replace('.', ',') + ' MB';
    let statTimer = 0;
    function stats() {
        const mem = renderer.info.memory || {};
        const vals = [
            nf(S.voxels),
            nf(S.shapes + S.seaShapes),
            (S.tris / 1e6).toFixed(2).replace('.', ',') + ' M',
            nf(S.artSegs) + (S.fineOn ? '' : ' · thô'),
            String(draws),
            (mem.geometries || 0) + ' · ' + (mem.textures || 0),
            mb(S.geoBytes),
            S.fbW + '×' + S.fbH,
            '≈ ' + mb(S.fbW * S.fbH * FB_BYTES) + (MSAA ? ' · 4×' : ''),
            mb((elev ? elev.byteLength : 0) + (cls ? cls.byteLength : 0) + (bathy ? bathy.byteLength : 0)),
            performance.memory ? mb(performance.memory.usedJSHeapSize) : '—',
            fps ? fps + ' fps' : 'nghỉ'
        ];
        for (let i = 0; i < vals.length; i++) if (statCells[i].textContent !== vals[i]) statCells[i].textContent = vals[i];
    }

    //  Khung hẹp (điện thoại, cột Wix hẹp): gập sẵn chú giải để bản đồ chiếm
    //  trọn bề ngang; bấm tiêu đề là mở ra như cũ.
    if ((container.clientWidth || 999) < 560) {
        $('#grpLegend').classList.add('collapsed');
        $('#grpLegend .grp-h').setAttribute('aria-expanded', 'false');
    }
    ['#grpLegend', '#grpViews', '#grpDisplay', '#grpCam'].forEach(s => initGroup($(s)));
    initGroup($('#grpDiag'), open => {
        clearInterval(statTimer);
        statTimer = open ? setInterval(stats, 500) : 0;
        if (open) stats();
    });

    /* ══════════════════════════════════════════════════════════════════════
       8 · VÒNG VẼ — chỉ vẽ khi có thay đổi, và NGỦ hẳn khi không có gì để làm
       Bản cũ để requestAnimationFrame chạy 60–120 lần/giây vĩnh viễn, kể cả
       khi màn hình đứng yên. Nay vòng lặp tự tắt sau ~0,5 giây yên tĩnh và chỉ
       thức dậy khi có thao tác, tween, tự xoay hay hoạt cảnh. Hoạt cảnh công
       trình chạy ở 30 khung/giây là đủ mượt cho thuyền và chim — trên màn
       120 Hz như MacBook thì đó là bớt 3/4 số lần vẽ cả cảnh.

       TĨNH LẶNG KHI VẮNG NGƯỜI. Hoạt cảnh chỉ là trang trí: 60 giây không có
       thao tác nào (chuột, chạm, phím, cuộn) thì thuyền, chim, cabin, máy bay
       đứng lại và vòng vẽ ngủ hẳn — trang nhúng Wix để mở cả buổi không còn
       vẽ 30 khung/giây cho ai cả. Chạm vào là chạy tiếp từ đúng chỗ cũ. Tự xoay
       thì KHÔNG dừng: đó là lệnh người xem tự bật.
       ══════════════════════════════════════════════════════════════════════ */
    let dirty = true, looping = false, quiet = 0, frames = 0, fps = 0, draws = 0, VW = 1, VH = 1;
    let tLast = performance.now(), lastAnim = 0, inView = true, lastInput = performance.now(), animClock = 0;
    const ANIM_MS = 1000 / 30, CALM_MS = 60000;
    const ARTL = () => { const out = []; for (const k in ART) out.push(ART[k]); return out; };
    let artList = [];
    //  Mức chi tiết theo độ phóng: nét mịn chỉ hiện khi đủ gần để đọc được.
    function updateLOD() {
        const on = camera.zoom >= homeZoom * FINE_AT;
        if (on === S.fineOn) return;
        S.fineOn = on;
        for (const A of artList) for (const m of A.fine) m.visible = on;
    }
    const onInput = () => { const was = performance.now() - lastInput > CALM_MS; lastInput = performance.now(); if (was) invalidate(); };
    for (const ev of ['pointerdown', 'pointermove', 'wheel', 'keydown', 'touchstart'])
        addEventListener(ev, onInput, { passive: true, capture: true });

    function loop() {
        const now = performance.now();
        let busy = false;
        if (tweens.length) { tweens = tweens.filter(f => !f(now)); dirty = true; busy = true; }
        if (controls.update()) busy = true;        // tự bắn 'change' khi có chuyển động
        clampTarget();
        if (S.spin) busy = true;
        //  Đồng hồ hoạt cảnh chỉ chạy khi hoạt cảnh chạy: dừng lúc vắng người rồi
        //  tiếp tục thì vật đi tiếp từ chỗ cũ, không nhảy cóc.
        if (!REDUCED && now - lastInput < CALM_MS) {
            let any = false;
            for (let i = 0; i < artList.length; i++) if (artList[i].group.visible && artList[i].upd.length) { any = true; break; }
            if (any) {
                busy = true;
                if (now - lastAnim >= ANIM_MS) {
                    animClock += Math.min(100, now - (lastAnim || now)) / 1000;
                    lastAnim = now;
                    for (let i = 0; i < artList.length; i++) {
                        const A = artList[i];
                        if (!A.group.visible) continue;
                        for (let j = 0; j < A.upd.length; j++) A.upd[j](animClock);
                    }
                    dirty = true;
                }
            } else lastAnim = 0;
        } else lastAnim = 0;
        if (dirty) {
            dirty = false;
            updateLOD();
            layoutGrat();
            renderer.render(scene, camera);
            labels.render(scene, camera);
            if (pins) declutter();
            updateOverlays();
            frames++;
            //  info.render là số liệu CỦA KHUNG VỪA VẼ; đọc nó ở nhịp nghỉ luôn ra 0.
            draws = renderer.info.render.drawCalls || draws;
        }
        if (now - tLast > 500) {
            fps = Math.round(frames * 1000 / (now - tLast));
            frames = 0; tLast = now;
        }
        quiet = busy || dirty ? 0 : quiet + 1;
        if (quiet > 30) {                          // ~0,5 giây không có gì → ngủ
            looping = false;
            fps = 0;
            renderer.setAnimationLoop(null);
        }
    }
    function wake() {
        quiet = 0;
        if (!looping && inView && !document.hidden) { looping = true; renderer.setAnimationLoop(loop); }
    }
    const invalidate = () => { dirty = true; wake(); };
    controls.addEventListener('change', invalidate);
    controls.addEventListener('start', () => { S.atHome = false; tweens = []; wake(); });

    /*  Khung Wix cuộn khuất, hoặc tab bị ẩn: dừng hẳn vòng lặp. Trình duyệt đã tự
        hãm requestAnimationFrame của iframe khuất, nhưng tự dừng thì chắc chắn
        hoạt cảnh không ăn pin ở đâu đó ngoài tầm mắt. */
    const io = new IntersectionObserver(es => {
        inView = es[es.length - 1].isIntersecting;
        if (inView) invalidate();
        else if (looping) { looping = false; renderer.setAnimationLoop(null); }
    });
    io.observe(container);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) invalidate(); });

    /*  Tỉ lệ điểm ảnh: tối đa 2× (độ phân giải gốc của màn Retina), rồi hạ xuống
        cho vừa NGÂN SÁCH tổng số điểm ảnh. Ví dụ: 1440×900 @2x → 2× đủ (5,2 triệu
        điểm); cửa sổ đầy màn 6K → ~1,25× (8 triệu điểm, ~128 MB bộ đệm thay vì
        ~1,2 GB của bản cũ). */
    function pixelRatioFor(w, h) {
        const dpr = window.devicePixelRatio || 1;
        return Math.max(0.5, Math.min(dpr, 2, Math.sqrt(PX_BUDGET / (w * h))));
    }
    const ro = new ResizeObserver(resize);
    ro.observe(container);
    function resize() {
        const w = container.clientWidth || 1, h = container.clientHeight || 1;
        const a = w / h, pr = pixelRatioFor(w, h);
        VW = w; VH = h;
        camera.left = -FRUSTUM * a; camera.right = FRUSTUM * a;
        camera.top = FRUSTUM; camera.bottom = -FRUSTUM;
        camera.updateProjectionMatrix();
        //  MỘT lần cấp lại bộ đệm (setPixelRatio rồi setSize là hai lần).
        renderer.setDrawingBufferSize(w, h, pr);
        renderer.domElement.style.width = w + 'px';
        renderer.domElement.style.height = h + 'px';
        dropIdleColorBuffer();
        labels.setSize(w, h);
        S.pr = pr; S.fbW = Math.floor(w * pr); S.fbH = Math.floor(h * pr);
        //  Đang ở khung toàn đảo thì khớp lại theo cỡ mới — khung Wix co giãn theo
        //  bề ngang trang, không khớp lại thì đảo lệch hoặc tràn.
        if (!first && S.atHome && !tweens.length) {
            angles();
            const tilted = _sph.phi > 0.15;
            const fit = flyView(_sph.theta, _sph.phi, 0);
            if (!tilted) { homeZoom = fit.zoom; controls.minZoom = homeZoom * 0.55; controls.maxZoom = homeZoom * 60; }
        }
        lastScale = '';
        gratZoom = 0;
        invalidate();
    }
    //  Kéo cửa sổ sang màn có mật độ điểm ảnh khác: tính lại tỉ lệ.
    let dprMQ = null;
    const watchDpr = () => {
        if (dprMQ) dprMQ.removeEventListener('change', onDpr);
        dprMQ = matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
        dprMQ.addEventListener('change', onDpr);
    };
    const onDpr = () => { watchDpr(); resize(); };
    watchDpr();

    /*  Dọn sạch khi rời trang thật sự. Trang được cất vào bộ đệm lùi/tiến
        (persisted) thì GIỮ NGUYÊN — tháo hết ra thì lúc người xem bấm "Quay lại"
        trang hiện về chỉ còn khung trống. */
    let disposed = false;
    addEventListener('pagehide', e => {
        if (e.persisted || disposed) return;
        disposed = true;
        renderer.setAnimationLoop(null);
        ro.disconnect(); io.disconnect(); clearInterval(statTimer);
        disposeVoxels(); disposePins(); disposeSeabed(); disposeArt(); artMat.dispose();
        disposeLines(roads); disposeLines(ferries);
        disposeSea();
        voxMat.dispose(); seaMat.dispose();
        atlas.dispose(); palette.dispose(); hypso.dispose(); bathyRamp.dispose();
        controls.dispose();
        renderer.dispose();
    });

    /* ── chạy ───────────────────────────────────────────────────────────── */
    resize();
    renderer.render(scene, camera);          // khung đầu: nền kem, không chớp đen
    $('#loading').classList.add('on');
    setBar(15, 'Đang giải mã dữ liệu cao độ…');
    try { await decodeSources(); }
    catch (e) { console.error(e); return fail('Không đọc được dữ liệu cao độ nhúng trong trang.'); }
    await rebuild();
}
    </script>
