    import(_V + '/examples/jsm/renderers/CSS2DRenderer.js?external=three')
])
    .then(([THREE, TSL, oc, css2d]) => build(THREE, TSL, oc.OrbitControls, css2d.CSS2DRenderer, css2d.CSS2DObject))
    .catch(e => { console.error(e); fail('Không nạp được thư viện three.js — kiểm tra kết nối mạng.'); });

async function build(THREE, TSL, OrbitControls, CSS2DRenderer, CSS2DObject) {
    /*  Mọi màu trong trang là mã sRGB viết tay, và nên được trộn như CSS trộn.
        Tắt quản lý màu để three KHÔNG đổi chúng sang không gian tuyến tính; đầu ra
        để "tuyến tính" (tức ghi nguyên giá trị) và không ánh xạ tông. Hệ quả quan
        trọng nhất nằm ở bộ nhớ — xem ghi chú ngay dưới. */
    THREE.ColorManagement.enabled = false;
    const container = $('#scene');

    /*  ── BỘ ĐỆM KHUNG HÌNH: chỗ ngốn RAM thật sự ─────────────────────────────
        Đo trên Chrome / Apple M4, tiến trình GPU trước → sau khi mở trang:
          · cửa sổ 1440×900 @2x: ~+300 MB · cửa sổ đầy màn 6K (3008×1692 @2x): ~+1,2 GB.
        Nguyên do: antialias + ACES khiến three r171 vẽ cả cảnh vào một bộ đệm
        trung gian RGBA16F khử răng cưa 4 mẫu (32 B/điểm ảnh) + bản giải mẫu (8) +
        độ sâu 4 mẫu (16), rồi vẽ thêm một tứ giác ra canvas CŨNG 4 mẫu (màu 16 +
        độ sâu 16) — chưa kể chuỗi ảnh trình chiếu: ~100 byte mỗi điểm ảnh.
        Nay không ánh xạ tông → three bỏ hẳn bộ đệm trung gian. Màn mật độ cao
        (dpr ≥ 1,5) vẽ thẳng ở độ phân giải gốc, không khử răng cưa — điểm ảnh đã
        đủ nhỏ để răng cưa khó thấy: còn ~16 B/điểm. Màn thường (1×) giữ 4 mẫu
        (~44 B/điểm) vì ở đó răng cưa lộ rõ. Thêm trần tổng số điểm ảnh, để cửa sổ
        khổng lồ không kéo bộ nhớ phình theo diện tích. */
    const MSAA = (window.devicePixelRatio || 1) < 1.5;
    const PX_BUDGET = MSAA ? 3.7e6 : 8e6;
    const FB_BYTES = MSAA ? 44 : 16;
    const renderer = new THREE.WebGPURenderer({ antialias: MSAA, alpha: false });
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    //  Canvas ĐỤC tô sẵn đúng màu nền trang: nhìn y như canvas trong suốt đặt trên
    //  nền #E2D6C0, nhưng trình tổng hợp khỏi phải trộn alpha cả khung mỗi lần vẽ.
    renderer.setClearColor(0xE2D6C0, 1);
    container.appendChild(renderer.domElement);
    try { await renderer.init(); }
    catch (e) { console.error(e); return fail('Trình duyệt không khởi tạo được WebGPU/WebGL2.'); }

    /*  three r171 cấp lại một `colorBuffer` cỡ canvas MỖI lần đổi cỡ, kể cả khi
        không khử răng cưa — lúc đó nó không gắn vào lượt vẽ nào (đích vẽ là thẳng
        ảnh của canvas), chỉ chiếm 4 byte/điểm ảnh. Trả lại ngay sau mỗi lần đổi cỡ. */
    const dropIdleColorBuffer = () => {
        const b = renderer.backend;
        if (!MSAA && b && b.colorBuffer && typeof b.colorBuffer.destroy === 'function') {
            b.colorBuffer.destroy();
            b.colorBuffer = null;
        }
    };

    const labels = new CSS2DRenderer();
    labels.domElement.style.position = 'absolute';
    labels.domElement.style.top = '0';
    labels.domElement.style.left = '0';
    //  Ngữ cảnh xếp chồng riêng: CSS2DRenderer đánh z-index cho TỪNG nhãn theo
    //  khoảng cách (có thể lên hàng chục); không gói lại thì nhãn tranh chỗ với
    //  HUD (z-index 5) và thẻ ghim nổi đè lên bảng chú giải.
    labels.domElement.style.zIndex = '1';
    container.appendChild(labels.domElement);

    const scene = new THREE.Scene();

    const FRUSTUM = 1000;
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 12000);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotateSpeed = 0.9;
    controls.maxPolarAngle = Math.PI * 0.495;
    //  Lăn chuột phóng VÀO ĐÚNG CHỖ con trỏ, như mọi bản đồ — không kéo về tâm.
    controls.zoomToCursor = true;

    const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const atlas = grainAtlas(THREE, 4, 4);
    const palette = paletteTexture(THREE);
    const hypso = rampTexture(THREE, rampAt);
    //  Cùng lý do như dải cao độ: thềm quanh đảo phần lớn nông, tra thẳng thì gần
    //  hết mặt biển dồn vào một quãng ngắn đầu dải. Bẻ cong để phần nông trải ra.
    const bathyRamp = rampTexture(THREE, t => bathyColor(Math.pow(t, 0.55)));
    const voxMat = voxelMaterial(THREE, TSL, atlas, palette, hypso, 4, 4);
    const seaMat = seabedMaterial(THREE, TSL, bathyRamp);
    const U = voxMat.userData.u;

    /* ── trạng thái ─────────────────────────────────────────────────────── */
    const S = {
        /*  Cạnh khối 1,0 pixel DEM ≈ 37,6 m — cố định. Đường, ghim và công trình
            được đặt cao độ MỘT LẦN theo cạnh này lúc dựng. */
        step: 1.0, sel: -1, spin: false, sea: true, relief: true, busy: false,
        layers: 0, shapes: 0, seabed: 0, seaShapes: 0,
        show: { hatang: false, dulich: false, giaothong: false, duong: true },
        geoBytes: 0, voxels: 0, tris: 0, focus: null, focusObj: null, atHome: true, pr: 1, fbW: 0, fbH: 0,
        artSegs: 0, fineOn: null
    };
    const BOX = { minX: 0, maxX: 0, minZ: 0, maxZ: 0, cx: 0, cz: 0, r: 800, topY: 0 };

    let voxels = null, roads = null, ferries = null, pins = null, sea = null, seabed = null, first = true;
    const CX = PQDEM.w / 2, CZ = PQDEM.h / 2;
    const geoBytes = g => Object.values(g.attributes).reduce((s, a) => s + a.array.byteLength, 0)
        + (g.index ? g.index.array.byteLength : 0);

    /* ── 5a · dựng khối voxel ───────────────────────────────────────────── */
    function disposeVoxels() {
        if (!voxels) return;
        scene.remove(voxels);
        for (const m of voxels.children) m.geometry.dispose();   // gồm cả iPos, iLit
        voxels.clear();
        voxels = null;
    }

    /*  Phân loại cột "bị lấp" cần biết chiều cao BỐN HÀNG XÓM. Thay vì dựng sẵn
        bản đồ chiều cao cả lưới, dùng CỬA SỔ BA HÀNG trượt dần: hàng trên, hàng
        đang xét, hàng dưới — vài KB thay vì vài MB, mà vẫn đủ cả 8 ô quanh mỗi
        cột cho bóng góc khối. */
    function rowTops(jz, stp, nx, nz, out) {
        out.fill(0);
        if (jz < 0 || jz >= nz) return out;
        for (let jx = 0; jx < nx; jx++) out[jx] = colTopCubes(jx, jz, stp);
        return out;
    }

    function buildVoxels(stp) {
        const W = PQDEM.w, H = PQDEM.h;
        const nx = Math.round(W / stp), nz = Math.round(H / stp);
        if (nx > U16 || nz > U16) throw new Error('lưới khối vượt tầm chỉ số 16 bit');
        const light = makeLighting(nx, nz, stp);

        /*  GỘP ĐOẠN. Cột "bị lấp" chỉ còn mặt nóc, mà các nóc liền nhau rất hay
            CÙNG một mức khối. Gộp chúng thành một hình chữ nhật là bớt phần lớn số
            hình phải vẽ. Điều kiện gộp: cùng hàng, liền kề, cùng độ cao, cùng nhóm
            địa mạo, bản thân từng ô cũng bị lấp — và nay thêm: cùng mẫu bóng góc
            khối, mẫu ấy không đổi dọc theo trục X (để nội suy trên hình gộp vẫn
            đúng), độ sáng lệch không quá `SHADE.tol`. */
        let rows = [new Uint16Array(nx), new Uint16Array(nx), new Uint16Array(nx)];
        const rL = new Uint8Array(nx), rV = new Uint8Array(nx), rR = new Uint8Array(nx), rA = new Uint8Array(nx);
        const lt = [0, 0, 0], tol = SHADE.tol;
        const scan = (onCap, onFull) => {
            let prev = rows[0], cur = rows[1], next = rows[2];
            rowTops(-1, stp, nx, nz, prev);
            rowTops(0, stp, nx, nz, cur);
            for (let jz = 0; jz < nz; jz++) {
                rowTops(jz + 1, stp, nx, nz, next);
                for (let jx = 0; jx < nx; jx++) {
                    const t = cur[jx];
                    if (!t) continue;
                    light(jx, jz, lt);
                    rL[jx] = lt[0]; rV[jx] = lt[1]; rR[jx] = lt[2];
                    const w = jx > 0 ? cur[jx - 1] : 0, e = jx < nx - 1 ? cur[jx + 1] : 0;
                    const n = prev[jx], s = next[jx];
                    const nw = jx > 0 ? prev[jx - 1] : 0, ne = jx < nx - 1 ? prev[jx + 1] : 0;
                    const sw = jx > 0 ? next[jx - 1] : 0, se = jx < nx - 1 ? next[jx + 1] : 0;
                    //  Thứ tự bit khớp chỉ số góc trong trình đổ bóng: (−x,−z) (+x,−z) (−x,+z) (+x,+z).
                    rA[jx] = aoLevel(t, w, n, nw) | aoLevel(t, e, n, ne) << 2
                        | aoLevel(t, w, s, sw) << 4 | aoLevel(t, e, s, se) << 6;
                }
                const buried = k => Math.min(
                    k > 0 ? cur[k - 1] : 0, k < nx - 1 ? cur[k + 1] : 0,
                    prev[k], next[k]) >= cur[k];
                for (let jx = 0; jx < nx; jx++) {
                    const t = cur[jx];
                    if (!t) continue;
                    if (!buried(jx)) { onFull(jx, jz, t); continue; }
                    const c0 = clsAt(jx * stp, jz * stp), a0 = rA[jx], l0 = rL[jx];
                    let k = jx + 1;
                    if ((a0 & 3) === ((a0 >> 2) & 3) && ((a0 >> 4) & 3) === (a0 >> 6))
                        while (k < nx && k - jx < RUN_MAX && cur[k] === t && buried(k)
                            && rA[k] === a0 && Math.abs(rL[k] - l0) <= tol
                            && clsAt(k * stp, jz * stp) === c0) k++;
                    onCap(jx, jz, t, k - jx, c0);
                    jx = k - 1;
                }
                const r = prev; prev = cur; cur = next; next = r;   // xoay vòng
            }
        };

        //  Đếm trước rồi mới cấp phát: cấp đúng số hình từng loại, không cấp theo lưới.
        let nCap = 0, nFull = 0, topMax = 1, cells = 0;
        let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
        const bound = (jx, jz, t, run) => {
            cells += run;
            if (t > topMax) topMax = t;
            if (jx < minX) minX = jx;
            if (jx + run - 1 > maxX) maxX = jx + run - 1;
            if (jz < minZ) minZ = jz; if (jz > maxZ) maxZ = jz;
        };
        scan((jx, jz, t, run) => { nCap++; bound(jx, jz, t, run); },
            (jx, jz, t) => { nFull++; bound(jx, jz, t, 1); });
        if (!nCap && !nFull) throw new Error('không tìm thấy ô đất nào trong dữ liệu cao độ');
        if (topMax > TOP_MAX) throw new Error('cột cao quá 7 bit dành cho chiều cao');

        const capData = new Uint16Array(nCap * 4), fullData = new Uint16Array(nFull * 4);
        const capLit = new Uint8Array(nCap * 4), fullLit = new Uint8Array(nFull * 4);
        let ci = 0, fi = 0;
        //  Hạt giống theo ô LƯỚI KHỐI, không theo pixel DEM: nếu theo pixel thì các
        //  khối con cùng một pixel sẽ đội chung một mảng vân.
        const seedOf = (jx, jz) => (hash01(jz * nx + jx) * 16) | 0;
        const lit = (arr, w, jx) => { arr[w] = rL[jx]; arr[w + 1] = rV[jx]; arr[w + 2] = rR[jx]; arr[w + 3] = rA[jx]; };
        scan((jx, jz, t, run, c) => {
            const w = ci; ci += 4;
            capData[w] = jx; capData[w + 1] = jz;
            capData[w + 2] = t | (run << 7);
            capData[w + 3] = c * 16 + seedOf(jx, jz);
            lit(capLit, w, jx);
        }, (jx, jz, t) => {
            const w = fi; fi += 4;
            fullData[w] = jx; fullData[w + 1] = jz;
            fullData[w + 2] = t | 128;                 // run = 1
            fullData[w + 3] = clsAt(jx * stp, jz * stp) * 16 + seedOf(jx, jz);
            lit(fullLit, w, jx);
        });
        rows = null;

        const grp = new THREE.Group();
        const add = (geo, data, lt4, count) => {
            if (!count) return;
            //  `normalized = true` — số nguyên vào, số thực [0,1] ra.
            geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(data, 4, true));
            geo.setAttribute('iLit', new THREE.InstancedBufferAttribute(lt4, 4, true));
            geo.instanceCount = count;
            const mesh = new THREE.Mesh(geo, voxMat);
            //  Vị trí đỉnh do positionNode quyết định nên hộp bao three tự tính không
            //  đúng; khối này phủ cả cảnh, cắt theo khung nhìn cũng vô nghĩa.
            mesh.frustumCulled = false;
            grp.add(mesh);
        };
        add(columnGeometry(THREE), fullData, fullLit, nFull);
        add(capGeometry(THREE), capData, capLit, nCap);
        scene.add(grp);
        voxels = grp;

        const wx0 = minX * stp - CX, wx1 = maxX * stp - CX;
        const wz0 = minZ * stp - CZ, wz1 = maxZ * stp - CZ;
        const topW = topMax * stp;
        Object.assign(BOX, {
            minX: wx0, maxX: wx1, minZ: wz0, maxZ: wz1,
            cx: (wx0 + wx1) / 2, cz: (wz0 + wz1) / 2,
            r: 0.5 * Math.hypot(wx1 - wx0, wz1 - wz0), topY: topW
        });
        U.cube.value = stp;
        U.maxTop.value = topW;
        U.ox.value = CX;
        U.oz.value = CZ;
        S.voxels = cells;                       // số cột khối thật trên mặt đất
        S.shapes = nCap + nFull;                // số hình phải dựng — thứ máy thật sự trả giá
        S.tris = nFull * 10 + nCap * 2;
        S.layers = topMax;
        S.geoBytes = capData.byteLength + fullData.byteLength + capLit.byteLength + fullLit.byteLength;
        return { n: cells, hiE: Math.round(topW / UNIT_PER_M) };
    }

    /* ── 5a bis · đáy biển ──────────────────────────────────────────────────
       Nguồn độ sâu chỉ mịn ~301 m nên ô 150 m là đã lấy hết thông tin có thật.
       Bản trước dựng MỌI ô thành cột đủ 5 mặt: 105 nghìn cột, 1,05 triệu tam giác
       — hơn nửa số tam giác của cả cảnh cho một lớp nhìn qua mặt nước. Nay dùng
       đúng luật "bị lấp" + gộp đoạn như phần đất. */
    const SEA_CUBE = 4, SEA_QUANT = 0.25;
    function buildSeabed() {
        disposeSeabed();
        const nx = Math.round(PQDEM.w / SEA_CUBE), nz = Math.round(PQDEM.h / SEA_CUBE);
        const floorU = PQBATHY.max * UNIT_PER_M;               // sàn = chỗ sâu nhất
        const maxC = Math.round(floorU / SEA_QUANT);
        const hg = new Uint8Array(nx * nz);                    // 0 = ô đất, không dựng đáy
        for (let jz = 0; jz < nz; jz++) {
            for (let jx = 0; jx < nx; jx++) {
                const x = jx * SEA_CUBE, z = jz * SEA_CUBE;
                // Nếu là khối đất đảo Phú Quốc đứng cao trên mặt nước thì không cần dựng đáy biển bên dưới
                if (isLandAt(x, z) && eleLerp(x, z) > 1.5) continue;
                let d = depthAt(x, z);
                if (d <= 0.5) d = 1.2;                        // bảo đảm mọi ô biển đều có đáy, không bị thủng lỗ
                hg[jz * nx + jx] = Math.max(1, Math.min(maxC, Math.round((floorU - d * UNIT_PER_M) / SEA_QUANT)));
            }
        }
        //  Ô đất bên cạnh coi như cao vô hạn — mặt bên quay vào chân đảo không ai
        //  thấy; ra ngoài mép khung thì coi như 0 để khối bản đồ vẫn có vách.
        const at = (jx, jz) => (jx < 0 || jz < 0 || jx >= nx || jz >= nz) ? 0 : (hg[jz * nx + jx] || 255);
        const scan = (onCap, onFull) => {
            for (let jz = 0; jz < nz; jz++) {
                const r = jz * nx;
                const buried = k => Math.min(at(k - 1, jz), at(k + 1, jz), at(k, jz - 1), at(k, jz + 1)) >= hg[r + k];
                for (let jx = 0; jx < nx; jx++) {
                    const h = hg[r + jx];
                    if (!h) continue;
                    if (!buried(jx)) { onFull(jx, jz, h); continue; }
                    let k = jx + 1;
                    while (k < nx && k - jx < RUN_MAX && hg[r + k] === h && buried(k)) k++;
                    onCap(jx, jz, h, k - jx);
                    jx = k - 1;
                }
            }
        };
        let nCap = 0, nFull = 0, cells = 0;
        scan((jx, jz, h, run) => { nCap++; cells += run; }, () => { nFull++; cells++; });
        const capData = new Uint16Array(nCap * 4), fullData = new Uint16Array(nFull * 4);
        let ci = 0, fi = 0;
        scan((jx, jz, h, run) => {
            capData[ci] = jx; capData[ci + 1] = jz; capData[ci + 2] = h | (run << 7); ci += 4;
        }, (jx, jz, h) => {
            fullData[fi] = jx; fullData[fi + 1] = jz; fullData[fi + 2] = h | 128; fi += 4;
        });

        seabed = new THREE.Group();
        const add = (geo, data, count) => {
            if (!count) return;
            geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(data, 4, true));
            geo.instanceCount = count;
            const mesh = new THREE.Mesh(geo, seaMat);
            mesh.frustumCulled = false;
            seabed.add(mesh);
        };
        add(columnGeometry(THREE), fullData, nFull);
        add(capGeometry(THREE), capData, nCap);
        seaMat.userData.u.cube.value = SEA_CUBE;
        seaMat.userData.u.quant.value = SEA_QUANT;
        seaMat.userData.u.floorY.value = -floorU;
        seabed.visible = S.sea;
        scene.add(seabed);
        S.seabed = cells;
        S.seaShapes = nCap + nFull;
        S.geoBytes += capData.byteLength + fullData.byteLength;
        S.tris += nFull * 10 + nCap * 2;
    }
    function disposeSeabed() {
        if (!seabed) return;
        scene.remove(seabed);
        for (const m of seabed.children) m.geometry.dispose();
        seabed.clear();
        seabed = null;
    }

    /* ── 5b · mặt biển ──────────────────────────────────────────────────── */
    /*  KHUNG BẢN ĐỒ — mặt biển là một hình chữ nhật ĐẶC, mép sắc, trùng đúng mép
        ảnh dữ liệu; ngoài khung là nền kem. Có khung viền và lưới toạ độ rồi thì
        cạnh thẳng đọc ra đúng cái nó là: mép tờ bản đồ.
        Lưới nằm NGAY TRÊN mặt nước và THẤP HƠN nóc khối bờ, nên nó tự bị đất che —
        chỉ hiện trên biển, y như bản đồ giấy. */
    const SEA_Y = () => S.step * 0.45;      // cắt ngang lưng khối bờ
    function buildSea() {
        disposeSea();
        sea = new THREE.Group();

        const g = new THREE.PlaneGeometry(PQDEM.w, PQDEM.h);
        g.rotateX(-Math.PI / 2);
        //  Nước trong VỪA ĐỦ để nhìn thấy đáy: đặc quá thì lớp độ sâu coi như không
        //  tồn tại, trong quá thì mất hẳn cảm giác có mặt nước.
        const water = new THREE.Mesh(g, new THREE.MeshBasicNodeMaterial({
            color: 0xb4ccd4, transparent: true, opacity: 0.42, depthWrite: false
        }));
        water.position.y = SEA_Y();
        water.renderOrder = -1;
        sea.add(water);

        //  Lưới kinh–vĩ + khung viền gộp trong MỘT hình học, phân biệt bằng màu
        //  đỉnh: lưới nhỏ 0,05° mảnh mờ, lưới chính 0,10° rõ hơn, viền đậm nhất.
        const pos = [], col = [], c = new THREE.Color();
        const push = (x0, z0, x1, z1, hex, a) => {
            c.set(hex);
            const r = c.r + (1 - c.r) * (1 - a), gg = c.g + (1 - c.g) * (1 - a), b = c.b + (1 - c.b) * (1 - a);
            pos.push(x0, 0, z0, x1, 0, z1);
            col.push(r, gg, b, r, gg, b);
        };
        const eps = 1e-9;
        for (const [stepDeg, hex, a] of [[0.05, '#E2D6C0', 0.42], [0.10, '#E2D6C0', 0.78]]) {
            for (let k = Math.ceil((W_ - eps) / stepDeg); k * stepDeg <= E_ + eps; k++) {
                const lon = k * stepDeg;
                if (stepDeg === 0.05 && Math.abs(lon / 0.10 - Math.round(lon / 0.10)) < 1e-6) continue;
                const px = lonLatToPx(lon, N_)[0] - CX;
                push(px, -CZ, px, CZ, hex, a);
            }
            for (let k = Math.ceil((S_ - eps) / stepDeg); k * stepDeg <= N_ + eps; k++) {
                const lat = k * stepDeg;
                if (stepDeg === 0.05 && Math.abs(lat / 0.10 - Math.round(lat / 0.10)) < 1e-6) continue;
                const pz = lonLatToPx(W_, lat)[1] - CZ;
                push(-CX, pz, CX, pz, hex, a);
            }
        }
        const F = [[-CX, -CZ], [CX, -CZ], [CX, CZ], [-CX, CZ]];
        for (let i = 0; i < 4; i++) {
            const p = F[i], q = F[(i + 1) % 4];
            push(p[0], p[1], q[0], q[1], '#5f6b70', 1);
        }
        const gg = new THREE.BufferGeometry();
        gg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        gg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
        const grid = new THREE.LineSegments(gg, new THREE.LineBasicNodeMaterial({ vertexColors: true }));
        grid.position.y = SEA_Y() + 0.02;
        sea.add(grid);

        //  Số độ trên mép khung — vĩ độ ở cạnh tây, kinh độ ở cạnh nam. Đặt NGOÀI
        //  mép khung như bản đồ giấy: số độ là chú thích của khung, không phải nội dung.
        //  Khoảng cách tới mép khung tính theo PIXEL (xem `layoutGrat`), không theo
        //  đơn vị thế giới: cách cũ cố định 34 đơn vị nên khung nhỏ thì số độ đè lên
        //  mép khung, phóng to thì trôi xa khỏi nó.
        gratLabels = [];
        const lab = (txt, x, z, side) => {
            const d = document.createElement('div');
            d.className = 'grat';
            d.textContent = txt;
            const o = new CSS2DObject(d);
            o.position.set(x, SEA_Y() + 0.05, z);
            o.userData.side = side;
            sea.add(o);
            gratLabels.push(o);
        };
        const deg = (v, pos1, neg) => fmtDeg(v, pos1, neg, 2);
        for (let k = Math.ceil(S_ / 0.10); k * 0.10 <= N_; k++) {
            const lat = k * 0.10;
            lab(deg(lat, 'N', 'S'), -CX - 34, lonLatToPx(W_, lat)[1] - CZ, 'w');
        }
        for (let k = Math.ceil(W_ / 0.10); k * 0.10 <= E_; k++) {
            const lon = k * 0.10;
            lab(deg(lon, 'E', 'W'), lonLatToPx(lon, N_)[0] - CX, CZ + 30, 's');
        }
        gratZoom = 0;

        sea.visible = S.sea;
        scene.add(sea);
    }

    //  Đặt lại số độ mỗi khi độ phóng đổi: tâm nhãn cách mép khung đúng nửa bề
    //  rộng (hoặc nửa bề cao) của chính nó + vài pixel. Kích thước đo một lần.
    let gratLabels = [], gratZoom = 0;
    function layoutGrat() {
        if (!sea || camera.zoom === gratZoom) return;
        gratZoom = camera.zoom;
        const upp = (camera.right - camera.left) / camera.zoom / VW;     // đơn vị thế giới / px
        for (const o of gratLabels) {
            const u = o.userData;
            if (!u.hw && o.element.offsetWidth) { u.hw = o.element.offsetWidth / 2; u.hh = o.element.offsetHeight / 2; }
            if (u.side === 'w') o.position.x = -CX - ((u.hw || 22) + 7) * upp;
            else o.position.z = CZ + ((u.hh || 5) + 6) * upp;
        }
    }

    function disposeSea() {
        if (!sea) return;
        for (const o of sea.children) {
            if (o.element) o.element.remove();
            if (o.geometry) o.geometry.dispose();
            if (o.material) o.material.dispose();
        }
        sea.clear();
        scene.remove(sea);
        sea = null;
    }

    /* ── 5c · đường & tuyến phà ────────────────────────────────────────────
       ĐƯỜNG LÀ DẢI TAM GIÁC, KHÔNG PHẢI ĐƯỜNG KẺ.
       1) Bề dày. Cả WebGPU lẫn WebGL đều kẹp `linewidth` về đúng 1 pixel — muốn
          nét dày thì buộc phải tự dựng dải hình.
       2) Đứt đoạn. Đỉnh trong GeoJSON thưa, có đoạn dài hàng cây số, trong khi mặt
          đất là bậc thang. Đoạn thẳng nối hai đỉnh xa nhau chui xuyên qua các bậc
          ở giữa — nên chia nhỏ đoạn để nó bám theo bậc.
       Bản trước: 6 đỉnh rời mỗi tứ giác, màu Float32 (12 B/đỉnh) và giữ thêm một
       mảng cao độ để đặt lại khi đổi cạnh khối. Nay cạnh khối cố định nên cao độ
       nướng thẳng vào vị trí; tứ giác dùng 4 đỉnh + chỉ số, màu 4 byte/đỉnh. */
    const ROAD_STYLE = {
        runway: { w: 2.30, c: 0xE2D6C0 },   // đường băng — nét đậm nhất, đọc ra ngay
        taxiway: { w: 1.05, c: 0xf2f0e8 },
        primary: { w: 1.05, c: 0xE2D6C0 },
        secondary: { w: 0.80, c: 0xfaf8f1 },
        tertiary: { w: 0.62, c: 0xf2efe6 },
        minor: { w: 0.42, c: 0xe9e6da },
        cable: { w: 0.50, c: 0xe6dcef }
    };
    const SEG_MAX = 1.0;                    // chia nhỏ tới ~38 m mỗi đoạn

    function ribbonFrom(features, styleOf, cube) {
        //  Hai lượt cùng một phép chia: lượt đầu chỉ đếm để cấp mảng đúng cỡ.
        const walk = emit => {
            for (const f of features || []) {
                const gm = f.geometry;
                if (!gm || gm.type !== 'LineString' || gm.coordinates.length < 2) continue;
                const st = styleOf(f);
                let prev = null;
                for (const [lon, lat] of gm.coordinates) {
                    const [px, py] = lonLatToPx(lon, lat);
                    if (prev) {
                        const n = Math.max(1, Math.ceil(Math.hypot(px - prev[0], py - prev[1]) / SEG_MAX));
                        for (let i = 0; i < n; i++) {
                            const t0 = i / n, t1 = (i + 1) / n;
                            const x0 = prev[0] + (px - prev[0]) * t0, y0 = prev[1] + (py - prev[1]) * t0;
                            const x1 = prev[0] + (px - prev[0]) * t1, y1 = prev[1] + (py - prev[1]) * t1;
                            if (Math.hypot(x1 - x0, y1 - y0) < 1e-6) continue;
                            emit(x0, y0, x1, y1, st);
                        }
                    }
                    prev = [px, py];
                }
            }
        };
        let nQ = 0;
        walk(() => { nQ++; });
        if (!nQ) return null;
        const pos = new Float32Array(nQ * 12), rgb = new Uint8Array(nQ * 16);
        const idx = nQ * 4 > 65535 ? new Uint32Array(nQ * 6) : new Uint16Array(nQ * 6);
        //  Nhấc lên hơn một bậc thang để dải đường nổi hẳn trên mặt khối, không bị
        //  chính bậc mình đang nằm cắt ngang.
        const yAt = (x, y) => topOf(Math.max(0, eleAt(x, y)), cube, true) + cube + 0.34;
        let q = 0;
        walk((x0, y0, x1, y1, st) => {
            let dx = x1 - x0, dz = y1 - y0;
            const L = Math.hypot(dx, dz), hw = st.w / 2;
            dx /= L; dz /= L;
            const ex = dx * hw, ez = dz * hw;          // mũ hai đầu: chỗ gấp khúc không hở
            const px = -dz * hw, pz = dx * hw;         // pháp tuyến trong mặt phẳng ngang
            const ax = x0 - CX - ex, az = y0 - CZ - ez, bx = x1 - CX + ex, bz = y1 - CZ + ez;
            const ya = yAt(x0, y0), yb = yAt(x1, y1);
            const p = q * 12;
            pos[p] = ax + px; pos[p + 1] = ya; pos[p + 2] = az + pz;
            pos[p + 3] = ax - px; pos[p + 4] = ya; pos[p + 5] = az - pz;
            pos[p + 6] = bx - px; pos[p + 7] = yb; pos[p + 8] = bz - pz;
            pos[p + 9] = bx + px; pos[p + 10] = yb; pos[p + 11] = bz + pz;
            const r = (st.c >> 16) & 255, g = (st.c >> 8) & 255, b = st.c & 255;
            for (let v = 0, o = q * 16; v < 4; v++, o += 4) { rgb[o] = r; rgb[o + 1] = g; rgb[o + 2] = b; rgb[o + 3] = 255; }
            //  Thứ tự NGƯỢC KIM ĐỒNG HỒ nhìn từ trên xuống để pháp tuyến hướng lên.
            const i = q * 6, b0 = q * 4;
            idx[i] = b0; idx[i + 1] = b0 + 2; idx[i + 2] = b0 + 1;
            idx[i + 3] = b0; idx[i + 4] = b0 + 3; idx[i + 5] = b0 + 2;
            q++;
        });
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        g.setAttribute('rgb', new THREE.BufferAttribute(rgb, 4, true));
        g.setIndex(new THREE.BufferAttribute(idx, 1));
        return g;
    }

    /*  Tuyến phà vẫn là đường kẻ nét đứt: nó chạy trên mặt nước phẳng nên không
        vướng bậc thang nào, mà nét đứt thì chỉ vật liệu đường kẻ mới làm được.
        Không có sàn một khối: không thì cả hải trình bị nâng lên bằng nóc khối bờ. */
    function segmentsFrom(features, cube) {
        const pos = [];
        for (const f of features || []) {
            const gm = f.geometry;
            if (!gm || gm.type !== 'LineString' || gm.coordinates.length < 2) continue;
            let prev = null;
            for (const [lon, lat] of gm.coordinates) {
                const [px, py] = lonLatToPx(lon, lat);
                const p = [px - CX, topOf(Math.max(0, eleAt(px, py)), cube, false) + cube * 0.16, py - CZ];
                if (prev) pos.push(prev[0], prev[1], prev[2], p[0], p[1], p[2]);
                prev = p;
            }
        }
        if (!pos.length) return null;
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        return g;
    }

    function disposeLines(o) {
        if (!o) return;
        scene.remove(o);
        o.geometry.dispose();
        o.material.dispose();
    }

    function buildRoads(cube) {
        disposeLines(roads); disposeLines(ferries);
        roads = ferries = null;
        const data = JSON.parse(takeBlock('dat-roads'));

        const gr = ribbonFrom(data.features, f => ROAD_STYLE[f.properties && f.properties.c] || ROAD_STYLE.minor, cube);
        if (gr) {
            //  Không tô sáng: đường phải trắng đúng màu trắng ở mọi sườn dốc. Viết
            //  thẳng mảnh điểm ảnh từ thuộc tính màu — vật liệu không còn đòi pháp
            //  tuyến, hết luôn cảnh báo "normal not found" của bản trước.
            const m = new THREE.MeshBasicNodeMaterial({ side: THREE.DoubleSide });   // nhìn nghiêng từ dưới vẫn còn
            m.fragmentNode = TSL.vec4(TSL.attribute('rgb', 'vec4').xyz, TSL.float(1));
            roads = new THREE.Mesh(gr, m);
            roads.frustumCulled = false;
            scene.add(roads);
            S.geoBytes += geoBytes(gr);
        }

        const gf = segmentsFrom(FERRY_ROUTES.features, cube);
        if (gf) {
            ferries = new THREE.LineSegments(gf, new THREE.LineDashedNodeMaterial({
                color: 0xE2D6C0, dashSize: 14, gapSize: 10, transparent: true, opacity: 0.9
            }));
            ferries.computeLineDistances();
            scene.add(ferries);
            S.geoBytes += geoBytes(gf);
        }
        //  Giữ riêng tuyến cáp treo để dựng mô hình công trình — nó là đường đi
        //  thật của cabin, không phải đường bộ. Phần GeoJSON còn lại bỏ luôn.
        CABLE = data.features.filter(
            f => f.properties && f.properties.c === 'cable' && f.geometry
                && f.geometry.type === 'LineString').map(f => f.geometry.coordinates);
        //  …và hai đường băng: sân bay line-art dựng trong hệ toạ độ của chúng.
        RUNWAYS = data.features.filter(
            f => f.properties && f.properties.c === 'runway' && f.geometry
                && f.geometry.type === 'LineString').map(f => f.geometry.coordinates);
    }
    let CABLE = [];

    /* ── 5c bis · CÔNG TRÌNH LINE-ART ──────────────────────────────────────
       Vẽ bằng NÉT, không đổ khối: nền đã là hàng trăm nghìn khối đặc, thêm khối
       đặc nữa thì công trình chìm nghỉm; nét sáng mảnh nổi hẳn lên và giữ đúng
       tinh thần bản vẽ.

       MỖI LỚP MỘT BỘ CÔNG TRÌNH, bật tắt cùng ghim của lớp đó:
         · Du lịch   — công viên VinWonders, Aquatopia Hòn Thơm, Grand World, Safari,
                       Cầu Hôn, cụm APEC, nhà tù, vườn quốc gia, Suối Tranh, Tiên Sơn
                       Đỉnh, bảo tàng, 4 cụm nghỉ dưỡng, 3 làng chài, thuyền, chim;
         · Giao thông — sân bay (nhà ga, đài kiểm soát, máy bay đỗ & bay), 5 cảng,
                       phà chạy ĐÚNG 4 tuyến trong dữ liệu, cáp treo Hòn Thơm;
         · Hạ tầng    — đập & trạm bơm Dương Đông, 2 nhà máy nước, 2 hồ quy hoạch,
                       2 nhà máy rác. Hạng mục quy hoạch vẽ NÉT ĐỨT, như viền thẻ ghim.

       HAI MỨC CHI TIẾT. Nét "thô" là khung chính — luôn hiện. Nét "mịn" là lan can,
       cửa kính, giằng chéo, ván cầu… — chỉ hiện khi phóng ≥ FINE_AT lần khung toàn
       đảo; xa hơn thế mỗi nét chưa tới nửa điểm ảnh, vẽ ra chỉ thành lớp nhiễu.

       GỘP NÉT TĨNH. Bản trước mỗi công trình là một LineSegments riêng, ~20 lượt
       vẽ cho 9 công trình. Nay mọi nét tĩnh của một lớp nằm trong 2 hình học
       (thô/mịn), 16 byte mỗi đỉnh (vị trí Float32 + màu RGBA 8 bit), dùng chung
       MỘT vật liệu. Phần chuyển động là vài "bể nét" ghi đè tại chỗ mỗi khung —
       không cấp phát gì trong vòng vẽ.

       CỠ. Công trình hạ tầng (sân bay, cảng, nhà máy) gần đúng tỉ lệ thật vì nằm
       sát đường băng, đường bộ vốn vẽ đúng tỉ lệ; biểu tượng du lịch phóng to cỡ
       ký hiệu bản đồ để còn đọc được. */
    const FINE_AT = 2.2;
    const AC = {
        line: 0xf6eddb, detail: 0xfff9ee, roof: 0xf2c6ad, glass: 0xd8ecf3, water: 0xc4e4f1,
        warm: 0xffc97e, crane: 0xf2bd45, leaf: 0xd6e8bf, trunk: 0xe8d7b6, red: 0xff7765,
        green: 0x8be39a, wake: 0xeef8fc, star: 0xffb08a
    };
    //  Mọi nét line-art dùng chung một vật liệu: màu & độ đục đọc thẳng từ đỉnh.
    const artMat = new THREE.LineBasicNodeMaterial({ transparent: true });
    artMat.fragmentNode = TSL.attribute('rgba', 'vec4');

    /*  BỘ NÉT TĨNH. Khung toạ độ cục bộ (gốc, góc quay quanh trục đứng, tỉ lệ)
        để mỗi công trình được vẽ trong hệ của chính nó: +x là hướng "mặt tiền"
        (thường quay ra biển hoặc dọc đường băng), +z vuông góc, +y lên. */
    function lineKit() {
        const buf = [{ p: [], c: [] }, { p: [], c: [] }];
        let L = 0, cr = 246, cg = 237, cb = 219, ca = 255, dash = 0;
        let ox = 0, oy = 0, oz = 0, cs = 1, sn = 0, k = 1, kv = 1;
        const put = (x0, y0, z0, x1, y1, z1) => {
            const b = buf[L];
            b.p.push(x0, y0, z0, x1, y1, z1);
            b.c.push(cr, cg, cb, ca, cr, cg, cb, ca);
        };
        const K = {
            buf,
            frame(x, y, z, yaw, s, sv) {
                ox = x; oy = y; oz = z; cs = Math.cos(yaw || 0); sn = Math.sin(yaw || 0);
                k = s || 1; kv = sv || k; return K;
            },
            //  Từ hệ cục bộ ra thế giới — để các bể nét động dùng chung khung.
            wx: (x, z) => ox + (x * cs - z * sn) * k,
            wz: (x, z) => oz + (x * sn + z * cs) * k,
            wy: y => oy + y * kv,
            coarse() { L = 0; return K; },
            fine() { L = 1; return K; },
            col(hex, a) {
                cr = (hex >> 16) & 255; cg = (hex >> 8) & 255; cb = hex & 255;
                ca = Math.round((a === undefined ? 1 : a) * 255); return K;
            },
            //  Nét đứt cho hạng mục quy hoạch: `len` là độ dài một vạch (đơn vị thế giới).
            dashed(len) { dash = len || 0; return K; },
            seg(x0, y0, z0, x1, y1, z1) {
                const ax = K.wx(x0, z0), ay = K.wy(y0), az = K.wz(x0, z0);
                const bx = K.wx(x1, z1), by = K.wy(y1), bz = K.wz(x1, z1);
                if (!dash) { put(ax, ay, az, bx, by, bz); return K; }
                const dx = bx - ax, dy = by - ay, dz = bz - az, len = Math.hypot(dx, dy, dz);
                if (len < 1e-6) return K;
                for (let s = 0; s < len; s += dash * 1.8) {
                    const f0 = s / len, f1 = Math.min(len, s + dash) / len;
                    put(ax + dx * f0, ay + dy * f0, az + dz * f0, ax + dx * f1, ay + dy * f1, az + dz * f1);
                }
                return K;
            },
            poly(pts, closed) {
                for (let i = 1; i < pts.length; i++) K.seg(...pts[i - 1], ...pts[i]);
                if (closed && pts.length > 2) K.seg(...pts[pts.length - 1], ...pts[0]);
                return K;
            },
            rect(x0, z0, x1, z1, y) { return K.poly([[x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1]], true); },
            //  Hộp dây: tâm đáy (x, z), rộng w theo x, sâu d theo z, từ y0 cao h.
            box(x, z, w, d, y0, h) {
                const a = w / 2, b = d / 2, y1 = y0 + h;
                K.rect(x - a, z - b, x + a, z + b, y0).rect(x - a, z - b, x + a, z + b, y1);
                for (const [sx, sz] of [[-1, -1], [1, -1], [1, 1], [-1, 1]])
                    K.seg(x + sx * a, y0, z + sz * b, x + sx * a, y1, z + sz * b);
                return K;
            },
            //  Mái hai mái, nóc chạy theo trục x, mái chìa ra `o`.
            gable(x, z, w, d, y, h, o) {
                o = o === undefined ? 0.12 : o;
                const a = w / 2 + o, b = d / 2 + o;
                K.seg(x - a, y + h, z, x + a, y + h, z);
                for (const sx of [-1, 1])
                    K.seg(x + sx * a, y, z - b, x + sx * a, y + h, z).seg(x + sx * a, y + h, z, x + sx * a, y, z + b);
                return K.seg(x - a, y, z - b, x + a, y, z - b).seg(x - a, y, z + b, x + a, y, z + b);
            },
            //  Mái bốn mái (mái chảy nhiệt đới).
            hip(x, z, w, d, y, h, o) {
                o = o === undefined ? 0.12 : o;
                const a = w / 2 + o, b = d / 2 + o, r = Math.max(0, a - b);

                K.rect(x - a, z - b, x + a, z + b, y);
                for (const sx of [-1, 1]) for (const sz of [-1, 1]) K.seg(x + sx * a, y, z + sz * b, x, y + h, z);

            //  Mái cong đầu đao kiểu đình Việt: bốn góc diềm vểnh lên `lift`.
            curvedRoof(x, z, w, d, y, h, lift) {

                for (const sz of [-1, 1]) K.curve(t => [x - a + w * t, y + up(t), z + sz * b], 12);
                for (const sx of [-1, 1]) K.curve(t => [x + sx * a, y + up(t), z - b + d * t], 8);

            },
            //  Vòng đứng trong mặt phẳng x–y (tại độ sâu z).
            vring(x, y, z, r, n, a0, a1) {
                n = n || 24; a0 = a0 || 0; a1 = a1 === undefined ? Math.PI * 2 : a1;
                return K.curve(t => { const a = a0 + (a1 - a0) * t; return [x + Math.cos(a) * r, y + Math.sin(a) * r, z]; }, n);

            cyl(x, z, r, y0, h, n, nv) {

                for (let i = 0; i < nv; i++) {
                    const a = i / nv * Math.PI * 2 + Math.PI / 4;
                    K.seg(x + Math.cos(a) * r, y0, z + Math.sin(a) * r, x + Math.cos(a) * r, y0 + h, z + Math.sin(a) * r);
                }

            },
            //  Mặt đất (nóc khối) tại điểm cục bộ, tính tương đối với gốc khung.
            gy(x, z) { return (groundY(K.wx(x, z) + CX, K.wz(x, z) + CZ) - oy) / kv; },
            //  Đường cong BÁM ĐỊA HÌNH: fn(t) → [x, z], y = mặt đất + lift. Lấy mẫu dày
            //  để nét không cắt ngang các bậc khối.
            drape(fn, n, lift) { return K.curve(t => { const p = fn(t); return [p[0], K.gy(p[0], p[1]) + (lift || 0.08), p[1]]; }, n); },
            curve(fn, n) {
                let p = fn(0);
                for (let i = 1; i <= n; i++) { const q = fn(i / n); K.seg(p[0], p[1], p[2], q[0], q[1], q[2]); p = q; }
                return K;
            },
            //  Vạch tầng quanh thân nhà.
            floors(x, z, w, d, y0, h, n) {
                for (let i = 1; i < n; i++) K.rect(x - w / 2, z - d / 2, x + w / 2, z + d / 2, y0 + h * i / n);
                return K;
            },
            //  Song cửa đứng trên hai mặt vuông góc với z (mặt dài nằm theo x).
            mullions(x, z, w, d, y0, h, step, sides) {
                const a = w / 2, b = d / 2;
                for (let u = -a + step; u < a - 1e-6; u += step)

                return K;
            },
            //  Cây dừa: thân cong 3 đốt + 6 tàu lá rủ.
            palm(x, y, z, h, lean, rot) {

                let px = x, py = y, pz = z;
                K.col(AC.trunk);
                for (let i = 1; i <= 3; i++) {
                    const t = i / 3, qx = x + lx * t * t, qy = y + h * t, qz = z + lz * t * t;
                    K.seg(px, py, pz, qx, qy, qz); px = qx; py = qy; pz = qz;
                }
                K.col(AC.leaf);
                for (let i = 0; i < 6; i++) {
                    const a = i / 6 * Math.PI * 2 + rot, r = h * 0.42;
                    const mx = px + Math.cos(a) * r * 0.55, mz = pz + Math.sin(a) * r * 0.55, my = py + h * 0.08;
                    K.seg(px, py, pz, mx, my, mz).seg(mx, my, mz, px + Math.cos(a) * r, py - h * 0.22, pz + Math.sin(a) * r);

            },

            tree(x, y, z, h, r) {

                K.col(AC.leaf).ell(x, y + h * 0.7, z, r, r, 10);
                return K.curve(t => { const a = t * Math.PI * 2; return [x + Math.cos(a) * r, y + h * 0.7 + Math.sin(a) * h * 0.3, z]; }, 10);
            },

            //  (hx, hz) và tỉ lệ s — dùng cho máy bay đỗ, thuyền neo.

                }
                return K;
            }

    }

        const pa = new THREE.BufferAttribute(pos, 3);
        pa.setUsage(THREE.DynamicDrawUsage);
        g.setAttribute('position', pa);
        g.setAttribute('rgba', new THREE.BufferAttribute(col, 4, true));
        const mesh = new THREE.LineSegments(g, artMat);
        mesh.frustumCulled = false;
        S.geoBytes += pos.byteLength + col.byteLength;
        return { mesh, arr: pos, col, n: nSeg };

        seg(u0, y0, q0, u1, y1, q1) {

        for (let r = 0; r <= 160; r += 0.5) {
            const x = px + Math.cos(a) * r, y = py + Math.sin(a) * r;
            if (isLand(x, y)) { lx = x; ly = y; } else if (r > 1) break;
        }
        return [lx, ly];
    }
    //  Mọi công trình ven biển đặt theo một "bến": điểm mép bờ + hướng ra biển.
    function coastSite(px, py) {
        if (!isLand(px, py)) {
            const la = dirTo(px, py, true);
            for (let r = 0; r <= 140; r += 0.5) {
                const x = px + Math.cos(la) * r, y = py + Math.sin(la) * r;
                if (isLand(x, y)) { px = x; py = y; break; }
            }
        }
        const sea = dirTo(px, py, false);
        const [sx, sy] = shoreFrom(px, py, sea);
        return { px: sx, py: sy, x: sx - CX, z: sy - CZ, sea, y: Math.max(groundY(sx, sy), SEA_Y() + 0.4) };
    }
    const siteOf = name => {
        const it = INFRA.find(i => i.name === name);
        if (!it) return null;
        const [px, py] = lonLatToPx(it.lon, it.lat);
        return { it, px, py, x: px - CX, z: py - CZ, plan: it.src === 'plan' };
    };
    //  Điểm cục bộ (u, v) của một khung → pixel DEM, để thử đất/nước tại đó.
    const localPx = (o, yaw, u, v) => [o.px + u * Math.cos(yaw) - v * Math.sin(yaw), o.py + u * Math.sin(yaw) + v * Math.cos(yaw)];

    /* ════════ DU LỊCH ════════ */

    /*  VÒNG ĐU QUAY (VinWonders). Hai vành giàn, nan hoa cáp, trục, hai khung chữ
        A có giằng, sàn đón khách. Mặt bánh xe quay ra biển. Phần quay là một nhóm
        riêng xoay quanh trục; cabin là bể nét tính lại mỗi khung để LUÔN THẲNG
        ĐỨNG như cabin thật — bản trước cabin quay nghiêng theo vành. */
    function ferrisWheel(K, A, s, R) {
        const yaw = dirTo(s.px, s.py, false) - Math.PI / 2;
        const base = footY(s.px, s.py, 4), hubH = R * 1.12, t = R * 0.085, legX = R * 0.6, zL = t + R * 0.14;
        K.frame(s.x, base, s.z, yaw).coarse().col(AC.line);
        for (const zs of [-1, 1]) {
            const z = zs * zL, za = zs * (t + 0.12);
            K.seg(-legX, 0, z, 0, hubH, za).seg(legX, 0, z, 0, hubH, za)
                .seg(-legX * 0.64, hubH * 0.36, z * 0.92, legX * 0.64, hubH * 0.36, z * 0.92);
            K.fine().col(AC.detail, 0.8);
            for (const sx of [-1, 1]) {              // chân giàn: thanh thứ hai + bậc chéo
                const ix = sx * legX * 0.86;
                K.seg(ix, 0, z, 0, hubH * 0.94, za);
                for (let i = 0; i < 6; i++) {
                    const f0 = i / 6, f1 = (i + 1) / 6;
                    K.seg(sx * legX * (1 - f0), hubH * f0, z + (za - z) * f0, ix * (1 - f1), hubH * 0.94 * f1, z + (za - z) * f1);
                }
            }
            K.coarse().col(AC.line);
        }
        K.seg(0, hubH, -zL * 0.95, 0, hubH, zL * 0.95);                         // trục
        K.rect(-R * 0.86, -zL - 0.7, R * 0.86, zL + 0.7, 0.05);                 // sàn
        K.fine().col(AC.detail, 0.85);
        for (const sx of [-1, 1]) K.seg(sx * legX, 0, -zL, sx * legX * 0.5, hubH * 0.5, zL).seg(sx * legX, 0, zL, sx * legX * 0.5, hubH * 0.5, -zL);
        K.box(0, 0, R * 0.55, t * 2 + 0.7, 0.05, R * 0.1).rect(-R * 0.36, -t - 0.6, R * 0.36, t + 0.6, R * 0.12);
        for (let i = 0; i < 5; i++) K.seg(-R * 0.3, 0.3, zL + 0.9 + i * 0.35, R * 0.3, 0.3, zL + 0.9 + i * 0.35);   // rào xếp hàng

        //  Phần quay — dựng trong hệ của chính nó (tâm trục ở gốc).
        const W = lineKit(), N = 48, Ri = R * 0.9, KS = 16;
        W.coarse().col(AC.line);
        for (const z of [-t, t]) W.vring(0, 0, z, R, N);
        for (let i = 0; i < KS; i++) {
            const a = i / KS * Math.PI * 2;
            for (const z of [-t, t]) W.seg(Math.cos(a) * R * 0.07, Math.sin(a) * R * 0.07, z * 0.55, Math.cos(a) * R, Math.sin(a) * R, z);
        }
        W.fine().col(AC.detail, 0.8);
        for (const z of [-t, t]) {
            W.vring(0, 0, z, Ri, N);
            for (let i = 0; i < N; i++) {           // giàn tam giác giữa vành ngoài và vành trong
                const a0 = i / N * Math.PI * 2, a1 = (i + 0.5) / N * Math.PI * 2;
                W.seg(Math.cos(a0) * R, Math.sin(a0) * R, z, Math.cos(a1) * Ri, Math.sin(a1) * Ri, z);
                W.seg(Math.cos(a1) * Ri, Math.sin(a1) * Ri, z, Math.cos(a0 + Math.PI * 2 / N) * R, Math.sin(a0 + Math.PI * 2 / N) * R, z);
            }
            W.vring(0, 0, z * 0.55, R * 0.07, 10);
        }
        for (let i = 0; i < N; i += 3) { const a = i / N * Math.PI * 2; W.seg(Math.cos(a) * R, Math.sin(a) * R, -t, Math.cos(a) * R, Math.sin(a) * R, t); }
        W.col(AC.warm);
        for (let i = 0; i < N; i += 2) W.vring(0, 0, t + 0.02, R * 1.012, 1, i / N * Math.PI * 2, (i + 1) / N * Math.PI * 2);
        const [wc, wf] = kitMeshes(W);
        const spin = new THREE.Group(), hub = new THREE.Group();
        if (wc) spin.add(wc);
        if (wf) { spin.add(wf); A.fine.push(wf); }
        hub.add(spin);
        hub.position.set(s.x, base + hubH, s.z);
        hub.rotation.y = -yaw;                   // three quay ngược chiều quy ước của bộ nét
        A.group.add(hub);

        //  Cabin luôn thẳng đứng: 16 cabin × (8 nét vỏ + 1 thanh treo).
        const G = 16, w = R * 0.065, h = R * 0.08;
        const P = linePool(G * 9, () => rgba(AC.warm, 0.95));
        const cy = Math.cos(yaw), sy = Math.sin(yaw), wx0 = s.x, wy0 = base + hubH, wz0 = s.z;
        const OUT = [];                          // vỏ cabin: bát giác bo tròn, treo dưới chốt
        for (let i = 0; i < 8; i++) {
            const a = (i + 0.5) / 8 * Math.PI * 2;
            OUT.push(Math.cos(a) * w, -h * 1.35 + Math.sin(a) * h);
        }
        A.group.add(P.mesh);
        const a = P.arr;
        //  Mỗi cabin: thanh treo + 8 cạnh vỏ, viết thành 9 cặp điểm (x dọc mặt bánh xe,
        //  y lên) rồi ghi thẳng ra thế giới — không gọi hàm cho từng nét.
        const CAP = [0, 0, 0, -h * 0.35];
        for (let i = 0; i < 8; i++) { const j = (i + 1) % 8; CAP.push(OUT[i * 2], OUT[i * 2 + 1], OUT[j * 2], OUT[j * 2 + 1]); }
        A.upd.push(tt => {
            const ang = -tt * 0.12;
            let o = 0;
            for (let g = 0; g < G; g++) {
                const phi = g / G * Math.PI * 2 + ang, lx = Math.cos(phi) * R, ly = Math.sin(phi) * R;
                for (let k = 0; k < CAP.length; k += 2, o += 3) {
                    const x = lx + CAP[k];
                    a[o] = wx0 + cy * x; a[o + 1] = wy0 + ly + CAP[k + 1]; a[o + 2] = wz0 + sy * x;
                }
            }
            P.mesh.geometry.attributes.position.needsUpdate = true;
            spin.rotation.z = ang;
        });
    }

    /*  AQUATOPIA — công viên nước Sun World Hòn Thơm: tháp cầu trượt ba tầng sàn,
        máng xoắn ốc, máng sóng dài, máng phễu, bể sóng hình quạt, sông lười bao
        quanh. (Bản trước đặt ở đây một vòng đu quay — Hòn Thơm không có.) */
    function aquatopia(K, s) {
        const yaw = dirTo(s.px, s.py, false);
        const ox = s.px - Math.cos(yaw) * 5, oy = s.py - Math.sin(yaw) * 5;     // lùi vào đất 5 đơn vị
        K.frame(ox - CX, 0, oy - CZ, yaw);
        const T = -2, gT = Math.max(K.gy(T - 1, -1), K.gy(T + 1, 1), K.gy(T, 0));   // chân tháp
        K.coarse().col(AC.line);
        for (const [a, b] of [[-0.9, -0.9], [0.9, -0.9], [0.9, 0.9], [-0.9, 0.9]]) K.seg(T + a, gT, b, T + a, gT + 8.4, b);
        for (const y of [2.6, 5.2, 7.8]) K.rect(T - 1.1, -1.1, T + 1.1, 1.1, gT + y);
        K.col(AC.roof).pyramid(T, 0, 2.2, 2.2, gT + 8.4, 1.2);
        K.fine().col(AC.detail, 0.8);
        for (let l = 0; l < 3; l++) {                                           // giằng chéo mỗi tầng, mỗi mặt
            const y0 = gT + l * 2.6, y1 = y0 + 2.6;
            for (const [a0, b0, a1, b1] of [[-0.9, -0.9, 0.9, -0.9], [0.9, -0.9, 0.9, 0.9], [0.9, 0.9, -0.9, 0.9], [-0.9, 0.9, -0.9, -0.9]])
                K.seg(T + a0, y0, b0, T + a1, y1, b1).seg(T + a1, y0, b1, T + a0, y1, b0);
        }
        for (let i = 0; i < 9; i++) K.seg(T - 0.9 + (i % 2) * 1.8, gT + i * 0.87, 1.0, T + 0.9 - (i % 2) * 1.8, gT + (i + 1) * 0.87, 1.0);   // cầu thang
        //  Máng xoắn ốc: ống = hai mép song song + vòng ống mỗi 20°, xuống tới đất.
        const hEnd = K.gy(T + 2.6 * Math.cos(Math.PI * 4.5), 2.6 * Math.sin(Math.PI * 4.5)) + 0.4;
        const helix = (r, f) => { const a = f * Math.PI * 4.5, y = gT + 7.6 + (hEnd - gT - 7.6) * f; return [T + Math.cos(a) * r, y, Math.sin(a) * r]; };
        K.coarse().col(AC.line).curve(f => helix(2.3, f), 64).curve(f => helix(2.9, f), 64);
        K.fine().col(AC.detail, 0.75);
        for (let i = 0; i <= 40; i++) { const p = helix(2.3, i / 40), q = helix(2.9, i / 40); K.seg(p[0], p[1] + 0.25, p[2], q[0], q[1] + 0.25, q[2]); }
        //  Máng sóng: từ sàn trên cùng chạy thẳng ra phía biển, hai lượn sóng, hạ đúng mặt đất.
        const wEnd = K.gy(T + 10.9, 0) + 0.4;
        const wave = (q, f) => [T + 0.9 + f * 10, gT + 7.6 + (wEnd - gT - 7.6) * f + 0.7 * Math.sin(f * Math.PI * 3) * (1 - f), q];
        K.coarse().col(AC.line).curve(f => wave(-0.32, f), 40).curve(f => wave(0.32, f), 40);
        K.fine().col(AC.detail, 0.75);
        for (let i = 0; i <= 24; i++) { const p = wave(-0.32, i / 24), q = wave(0.32, i / 24); K.seg(p[0], p[1], p[2], q[0], q[1], q[2]); }
        for (let i = 2; i <= 22; i += 4) { const p = wave(0, i / 24); K.seg(p[0], p[1] - 0.05, 0, p[0], K.gy(p[0], 0), 0); }   // cột đỡ máng
        //  Máng phễu: vào từ sàn giữa, xoáy trong phễu, thoát xuống bể.
        const gF = K.gy(T + 2.5, -4);
        K.coarse().col(AC.line);
        for (const [r, y] of [[1.7, 2.7], [1.25, 2.4], [0.75, 2.0]]) K.ell(T + 2.5, gF + y, -4, r, r, 20);
        K.seg(T + 0.9, gT + 5.2, -0.9, T + 2.5, gF + 2.7, -2.3).seg(T + 2.5, gF + 2.0, -4, T + 4.2, K.gy(T + 4.2, -5.4) + 0.4, -5.4);
        K.fine().col(AC.detail, 0.75);
        for (const a of [0.5, 2.1, 3.7, 5.3]) K.seg(T + 2.5 + Math.cos(a) * 1.7, gF + 2.7, -4 + Math.sin(a) * 1.7, T + 2.5 + Math.cos(a) * 1.7, gF, -4 + Math.sin(a) * 1.7);
        K.coarse().col(AC.water);
        K.drape(f => [T + 9.6 + 3.2 * f, -1.6], 6).drape(f => [T + 12.8, -1.6 + 3.2 * f], 6).drape(f => [T + 12.8 - 3.2 * f, 1.6], 6).drape(f => [T + 9.6, 1.6 - 3.2 * f], 6);
        K.drape(f => [T + 3.4 + 2 * f, -6.4], 4).drape(f => [T + 5.4, -6.4 + 1.8 * f], 4).drape(f => [T + 5.4 - 2 * f, -4.6], 4).drape(f => [T + 3.4, -4.6 - 1.8 * f], 4);
        //  Bể sóng hình quạt + sóng — bám đất.
        const fan = (r, f, a0, a1) => { const a = a0 + (a1 - a0) * f; return [T - 2.5 + Math.cos(a) * r, -8.5 + Math.sin(a) * r * 0.57]; };
        K.drape(f => fan(4.6, f, Math.PI * 0.05, Math.PI * 0.95), 30).drape(f => { const p0 = fan(4.6, 0, Math.PI * 0.05, 1), p1 = fan(4.6, 1, 0, Math.PI * 0.95); return [p0[0] + (p1[0] - p0[0]) * f, p0[1] + (p1[1] - p0[1]) * f]; }, 12);
        K.fine();
        for (const r of [1.4, 2.4, 3.4]) K.drape(f => fan(r, f, Math.PI * 0.15, Math.PI * 0.85), 14, 0.1);
        //  Sông lười: hai vòng lượn bao quanh khu, chảy theo địa hình.
        const lazy = (r, f) => { const a = f * Math.PI * 2; return [T + 1.5 + Math.cos(a) * r * 1.25, Math.sin(a) * r * (1 + 0.12 * Math.sin(a * 3))]; };
        K.coarse().col(AC.water).drape(f => lazy(10.5, f), 120);
        K.fine().drape(f => lazy(9.6, f), 110);
        K.coarse();
        for (let i = 0; i < 8; i++) {
            const a = i / 8 * Math.PI * 2 + 0.3, r = 11.8, u = T + 1.5 + Math.cos(a) * r * 1.25, v = Math.sin(a) * r;
            const [px, py] = localPx({ px: ox, py: oy }, yaw, u, v);
            if (isLand(px, py)) K.palm(u, K.gy(u, v), v, 2.0, 0.22, a);
        }
    }

    /*  CẦU HÔN — hai nhịp vươn ra biển từ hai điểm trên bờ, uốn cong đón nhau và
        dừng lại cách nhau một khe. Có mặt cầu, lan can + con tiện, trụ chữ Y
        xuống nước, đèn ở hai đầu mút; tia sáng chạy qua khe là bể nét động. */
    function kissBridge(K, A, s) {
        const c = coastSite(s.px, s.py), yaw = c.sea;
        const y0 = Math.max(c.y, SEA_Y() + 0.6), y1 = y0 + 0.95, SY = SEA_Y();
        K.frame(c.x, 0, c.z, yaw);
        const arm = (zs) => {
            const P0 = [0, zs * 6.5], C1 = [9.6, zs * 6.5], P1 = [9, zs * 0.24];
            const at = t => {
                const a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, cc = t * t;
                return [a * P0[0] + b * C1[0] + cc * P1[0], y0 + (y1 - y0) * Math.sin(t * Math.PI / 2), a * P0[1] + b * C1[1] + cc * P1[1]];
            };
            const N = 30, pts = [];
            for (let i = 0; i <= N; i++) pts.push(at(i / N));
            const side = (i, off, dy) => {
                const p = pts[i], q = pts[Math.min(N, i + 1)], r = pts[Math.max(0, i - 1)];
                let tx = q[0] - r[0], tz = q[2] - r[2]; const L = Math.hypot(tx, tz) || 1; tx /= L; tz /= L;
                return [p[0] - tz * off, p[1] + dy, p[2] + tx * off];
            };
            K.coarse().col(AC.line);
            for (const off of [-0.34, 0.34]) for (let i = 0; i < N; i++) K.seg(...side(i, off, 0), ...side(i + 1, off, 0));
            K.fine().col(AC.detail, 0.85);
            for (const off of [-0.32, 0.32]) for (let i = 0; i < N; i++) {
                K.seg(...side(i, off, 0.42), ...side(i + 1, off, 0.42));
                if (i % 2 === 0) K.seg(...side(i, off, 0), ...side(i, off, 0.42));
            }
            for (let i = 0; i < N; i++) K.seg(...side(i, 0, -0.12), ...side(i + 1, 0, -0.12));
            K.coarse().col(AC.line);
            for (const t of [0.28, 0.52, 0.76]) {                           // trụ chữ Y
                const i = Math.round(t * N), p = pts[i], a = side(i, -0.3, 0), b = side(i, 0.3, 0);
                K.seg(p[0], SY - 0.6, p[2], p[0], p[1] - 0.45, p[2]);
                K.fine().col(AC.detail, 0.85).seg(p[0], p[1] - 0.45, p[2], ...a).seg(p[0], p[1] - 0.45, p[2], ...b).coarse().col(AC.line);
            }
            K.fine().col(AC.warm).ell(pts[N][0], pts[N][1] + 0.5, pts[N][2], 0.12, 0.12, 8);
            return pts[N];
        };
        const ta = arm(-1), tb = arm(1);
        K.fine().col(AC.detail, 0.6).rect(-2.2, -7.4, 0.2, 7.4, Math.max(c.y, SY + 0.6) - 0.05);   // quảng trường bờ
        for (let i = 0; i < 4; i++) K.seg(0.2 + i * 0.25, y0 - 0.1 - i * 0.12, -1.2, 0.2 + i * 0.25, y0 - 0.1 - i * 0.12, 1.2);
        //  Tia sáng qua khe: độ đục nhấp nháy — bể 1 nét có màu đổi theo khung.
        const P = linePool(1, () => rgba(AC.warm, 1));
        P.arr.set([K.wx(ta[0], ta[2]), ta[1] + 0.45, K.wz(ta[0], ta[2]), K.wx(tb[0], tb[2]), tb[1] + 0.45, K.wz(tb[0], tb[2])]);
        P.mesh.geometry.attributes.position.needsUpdate = true;
        const ca = P.mesh.geometry.attributes.rgba;
        A.group.add(P.mesh);
        A.upd.push(tt => {
            const v = Math.round(255 * (0.25 + 0.75 * (0.5 + 0.5 * Math.sin(tt * 2.2))));
            P.col[3] = P.col[7] = v; ca.needsUpdate = true;
        });
    }

    /*  CỤM APEC 2027 (Bãi Đất Đỏ, An Thới — khu lấn biển >16 ha): nền lấn biển có
        kè, trung tâm hội nghị–triển lãm mái sóng, nhà hát đa năng mái vỏ, công viên
        APEC, quảng trường 21 cột cờ (21 nền kinh tế thành viên) — và một cẩu tháp,
        vì công trình đang thi công. */
    function apecCluster(K, s) {
        const c = coastSite(s.px, s.py), yaw = c.sea;
        const py0 = Math.max(footY(s.px, s.py, 3), SEA_Y() + 0.7);
        K.frame(c.x, py0, c.z, yaw).coarse().col(AC.line);
        K.rect(-10, -9, 6.5, 9, 0);                                             // nền lấn biển
        K.fine().col(AC.detail, 0.7).rect(-10.5, -9.5, 7, 9.5, -0.55);
        for (let i = -9; i <= 9; i += 1.5) K.seg(6.5, 0, i, 7, -0.55, i);       // mái kè
        //  Trung tâm hội nghị: bệ kính + mái sóng (sóng chạy dọc chiều dài).
        K.coarse().col(AC.line).box(-2, 0, 5, 12, 0, 1.0);
        const roofY = (x, z) => 1.05 + (0.85 + 0.45 * Math.sin(0.5 * z + 0.8)) * Math.sin(Math.PI * (x + 4.8) / 5.9);
        for (const x of [-4.8, 1.1]) K.curve(f => { const z = -6.6 + 13.2 * f; return [x, 1.05, z]; }, 1);
        K.curve(f => { const z = -6.6 + 13.2 * f; return [-1.85, roofY(-1.85, z), z]; }, 30);
        for (let i = 0; i <= 17; i++) {
            const z = -6.6 + i * 13.2 / 17;
            (i % 2 ? K.fine().col(AC.detail, 0.75) : K.coarse().col(AC.line)).curve(f => { const x = -4.8 + 5.9 * f; return [x, roofY(x, z), z]; }, 12);
        }
        K.fine().col(AC.glass, 0.85);
        for (let z = -5.5; z <= 5.51; z += 0.5) K.seg(0.5, 0, z, 0.5, 1.0, z);  // mặt kính hướng biển
        K.seg(0.5, 0.5, -6, 0.5, 0.5, 6);
        K.col(AC.detail, 0.8).rect(0.5, -2.5, 2.4, 2.5, 0.85);                  // ô văng sảnh
        for (const z of [-2.3, 0, 2.3]) K.seg(2.3, 0, z, 2.3, 0.85, z);
        //  Nhà hát đa năng: trống tròn + mái vỏ.
        K.coarse().col(AC.line).cyl(-7, -5, 2.1, 0, 1.4, 24, 8);
        K.fine().col(AC.detail, 0.8);
        for (let i = 0; i < 10; i++) {
            const a = i / 10 * Math.PI * 2;
            K.curve(f => [-7 + Math.cos(a) * 2.1 * (1 - f * 0.92), 1.4 + Math.sin(f * Math.PI / 2) * 1.1, -5 + Math.sin(a) * 2.1 * (1 - f * 0.92)], 6);
        }
        K.ell(-7, 2.45, -5, 0.2, 0.2, 8);
        //  Công viên APEC.
        K.col(AC.leaf, 0.8).ell(-6.6, 0.02, 4.5, 2.8, 3.2, 24);
        for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2; K.tree(-6.6 + Math.cos(a) * 1.8, 0, 4.5 + Math.sin(a) * 2.2, 1.2, 0.45); }
        //  21 cột cờ xếp cung trước sảnh.
        for (let i = 0; i < 21; i++) {
            const a = -1.05 + 2.1 * i / 20, px = 3.2 + Math.cos(a) * 3.0, pz = Math.sin(a) * 3.9;
            K.coarse().col(AC.line).seg(px, 0, pz, px, 1.5, pz);
            K.fine().col(i % 2 ? AC.warm : AC.detail, 0.9).poly([[px, 1.48, pz], [px + 0.36, 1.46, pz], [px + 0.36, 1.28, pz], [px, 1.3, pz]]);
        }
        //  Cẩu tháp đang thi công.
        const cx = -4.6, cz = 6.2, mh = 8.6, ja = 0.65, jx = Math.cos(ja), jz = Math.sin(ja);
        K.coarse().col(AC.crane);
        for (const [a, b] of [[-0.3, -0.3], [0.3, -0.3], [0.3, 0.3], [-0.3, 0.3]]) K.seg(cx + a, 0, cz + b, cx + a, mh, cz + b);
        K.seg(cx - jx * 2.6, mh + 0.3, cz - jz * 2.6, cx + jx * 8.5, mh + 0.3, cz + jz * 8.5)        // cần chính & đối trọng
            .seg(cx, mh + 1.6, cz, cx + jx * 8.5, mh + 0.3, cz + jz * 8.5).seg(cx, mh + 1.6, cz, cx - jx * 2.6, mh + 0.3, cz - jz * 2.6)
            .seg(cx, mh, cz, cx, mh + 1.6, cz);
        K.box(cx - jx * 2.2, cz - jz * 2.2, 0.6, 0.6, mh - 0.3, 0.5);
        K.col(AC.warm).seg(cx + jx * 5.5, mh + 0.3, cz + jz * 5.5, cx + jx * 5.5, 3.2, cz + jz * 5.5)
            .rect(cx + jx * 5.5 - 0.2, cz + jz * 5.5 - 0.2, cx + jx * 5.5 + 0.2, cz + jz * 5.5 + 0.2, 3.2);
        K.fine().col(AC.crane, 0.8);
        for (let y = 0; y < mh - 0.5; y += 0.6)
            for (const [a0, b0, a1, b1] of [[-0.3, -0.3, 0.3, -0.3], [0.3, -0.3, 0.3, 0.3], [0.3, 0.3, -0.3, 0.3], [-0.3, 0.3, -0.3, -0.3]])
                K.seg(cx + a0, y, cz + b0, cx + a1, y + 0.6, cz + b1);
        for (let d = 0; d < 8.4; d += 0.7) K.seg(cx + jx * d, mh + 0.3, cz + jz * d, cx + jx * (d + 0.35), mh + 0.3 + 1.3 * (1 - (d + 0.35) / 8.5), cz + jz * (d + 0.35));
        K.box(cx + jx * 0.6, cz + jz * 0.6, 0.45, 0.45, mh - 0.55, 0.45);    // ca-bin lái cẩu
    }

    /*  KHU NGHỈ DƯỠNG — xếp THEO ĐƯỜNG BỜ chứ không rải ngẫu nhiên: hàng ô dù &
        ghế nằm sát cát, hàng dừa, dãy biệt thự mái chảy nhìn ra biển, bể bơi, khối
        khách sạn nhiều tầng có ban công, sảnh mái lớn. Bốn kiểu theo đúng chất
        từng bãi: khu nghỉ lớn (Bãi Dài), dãy khách sạn (Bãi Trường), phố Địa Trung
        Hải có tháp đồng hồ (Sunset Town), bungalow mái lá (Bãi Sao). */
    function resort(K, lon, lat, kind) {
        const [px0, py0] = snapLand(...lonLatToPx(lon, lat));
        const c = coastSite(px0, py0), yaw = c.sea;
        const okAt = (u, v) => { const [x, y] = localPx(c, yaw, u, v); return isLand(x, y); };
        const yAt = (u, v, r) => { const [x, y] = localPx(c, yaw, u, v); return footY(x, y, r || 1); };
        K.frame(c.x, 0, c.z, yaw);
        const villa = (u, v) => {
            if (!okAt(u, v)) return;
            const y = yAt(u, v, 1);
            K.coarse().col(AC.line).box(u, v, 1.3, 1.5, y, 0.62).col(AC.roof).hip(u, v, 1.3, 1.5, y + 0.62, 0.55, 0.18);
            K.fine().col(AC.detail, 0.8).seg(u + 0.65, y, v - 0.3, u + 0.65, y + 0.45, v - 0.3).seg(u + 0.65, y + 0.45, v - 0.3, u + 0.65, y + 0.45, v + 0.3)
                .seg(u + 0.65, y + 0.45, v + 0.3, u + 0.65, y, v + 0.3);
            K.col(AC.water, 0.9).rect(u + 0.95, v - 0.45, u + 1.75, v + 0.45, y + 0.05);
        };
        const hotel = (u, v, len, fl) => {
            if (!okAt(u, v)) return;
            const y = yAt(u, v, 3), h = fl * 0.4;
            K.coarse().col(AC.line).box(u, v, 1.8, len, y, h).box(u, v, 0.8, 1.0, y + h, 0.45);
            K.fine().col(AC.detail, 0.7).floors(u, v, 1.8, len, y, h, fl);
            for (let z = -len / 2 + 0.6; z < len / 2 - 0.3; z += 0.6) K.seg(u + 0.9, y, v + z, u + 0.9, y + h, v + z);   // vách ban công hướng biển
            K.col(AC.detail, 0.6).rect(u - 0.6, v - len / 2 + 0.4, u + 0.6, v - len / 2 + 2.2, y + h + 0.35);            // giàn rooftop bar
        };
        const pool = (u, v, w, d) => {
            if (!okAt(u, v)) return;
            const y = yAt(u, v, 2) + 0.06;
            K.coarse().col(AC.water).curve(f => { const a = f * Math.PI * 2; return [u + Math.cos(a) * w / 2, y, v + Math.sin(a) * d / 2 * (1 + 0.15 * Math.cos(a * 2))]; }, 28);
            K.fine().col(AC.water, 0.6);
            for (let i = -1; i <= 1; i++) K.seg(u + i * w * 0.18, y, v - d * 0.35, u + i * w * 0.18, y, v + d * 0.35);
            K.col(AC.detail, 0.8);
            for (let i = 0; i < 6; i++) { const z = v - d * 0.4 + i * d * 0.16; K.rect(u + w / 2 + 0.25, z, u + w / 2 + 0.75, z + 0.18, y + 0.08); }
        };
        const beach = (z0, z1) => {
            K.fine();
            for (let z = z0; z <= z1; z += 1.6) {
                if (!okAt(-0.8, z)) continue;
                const y = yAt(-0.8, z, 0) + 0.05;
                K.col(AC.warm, 0.9).ell(-0.8, y + 0.5, z, 0.42, 0.42, 8).seg(-0.8, y, z, -0.8, y + 0.5, z);
                K.col(AC.detail, 0.8).rect(-0.5, z - 0.35, -0.1, z - 0.18, y).rect(-0.5, z + 0.18, -0.1, z + 0.35, y);
            }
            K.coarse();
            for (let z = z0 + 0.8; z <= z1; z += 2.2) if (okAt(-1.9, z)) K.palm(-1.9, yAt(-1.9, z, 0), z, 1.9, 0.3, 0.6 + z * 0.37);
        };
        if (kind === 'resort') {
            beach(-11, 11);
            for (let z = -10.4; z <= 10.5; z += 2.6) villa(-3.8, z);
            pool(-6.2, 0, 3.4, 5.4);
            hotel(-9.4, -5.6, 7, 8); hotel(-9.4, 5.6, 7, 8);
            if (okAt(-12.4, 0)) { const y = yAt(-12.4, 0, 2); K.coarse().col(AC.line).box(-12.4, 0, 2.4, 4.4, y, 1.0).col(AC.roof).hip(-12.4, 0, 2.4, 4.4, y + 1.0, 1.1, 0.35); }
        } else if (kind === 'long') {
            beach(-12, 12);
            for (let z = -7.5; z <= 7.6; z += 3) villa(-3.4, z);
            pool(-5.8, 0, 3, 4.2);
            hotel(-8.2, -8.6, 6.5, 6); hotel(-8.2, 0, 6.5, 7); hotel(-8.2, 8.6, 6.5, 6);
        } else if (kind === 'town') {
            //  Phố Sunset Town: dãy nhà phố mái dốc san sát + tháp đồng hồ đầu phố.
            for (const u of [-3.8, -6.6, -9.4]) for (let v = -7.5; v <= 7.6; v += 1.5) {
                if (!okAt(u, v)) continue;
                const y = yAt(u, v, 1), h = 1.1 + 0.35 * ((Math.abs(v * 7 + u * 3) | 0) % 3);
                K.coarse().col(AC.line).box(u, v, 2.0, 1.25, y, h).col(AC.roof).gable(u, v, 2.0, 1.25, y + h, 0.55, 0.08);
                K.fine().col(AC.detail, 0.75).seg(u + 1.0, y + h * 0.55, v - 0.4, u + 1.0, y + h * 0.55, v + 0.4)
                    .seg(u + 1.0, y + 0.08, v - 0.15, u + 1.0, y + 0.55, v - 0.15).seg(u + 1.0, y + 0.55, v - 0.15, u + 1.0, y + 0.55, v + 0.15).seg(u + 1.0, y + 0.55, v + 0.15, u + 1.0, y + 0.08, v + 0.15);
            }
            if (okAt(-2.0, 0)) {
                const y = yAt(-2.0, 0, 1);
                K.coarse().col(AC.line).box(-2.0, 0, 0.9, 0.9, y, 4.2).col(AC.roof).pyramid(-2.0, 0, 0.9, 0.9, y + 4.2, 1.1, 0.12);
                K.fine().col(AC.warm).curve(t => [-1.54, y + 3.6 + Math.sin(t * Math.PI * 2) * 0.3, Math.cos(t * Math.PI * 2) * 0.3], 12);
                K.col(AC.detail).seg(-1.53, y + 3.6, 0, -1.53, y + 3.82, 0).seg(-1.53, y + 3.6, 0, -1.53, y + 3.6, 0.17);
            }
            K.fine().col(AC.detail, 0.6).seg(-0.6, yAt(-0.6, -9, 0) + 0.05, -9, -0.6, yAt(-0.6, 9, 0) + 0.05, 9);   // đường dạo ven biển
        } else {
            //  Bãi Sao: bungalow sàn gỗ mái lá dốc, quán bar mái tranh, ghế dù.
            beach(-8, 8);
            for (let v = -7.2; v <= 7.3; v += 2.4) {
                if (!okAt(-3.0, v)) continue;
                const y = yAt(-3.0, v, 1);
                K.fine().col(AC.detail, 0.8);
                for (const [a, b] of [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]]) K.seg(-3.0 + a, y, v + b, -3.0 + a, y + 0.3, v + b);
                K.coarse().col(AC.line).box(-3.0, v, 1.0, 1.0, y + 0.3, 0.5).col(AC.roof).pyramid(-3.0, v, 1.0, 1.0, y + 0.8, 0.85, 0.25);
            }
            if (okAt(-1.4, 0)) {
                const y = yAt(-1.4, 0, 1);
                K.coarse().col(AC.roof).gable(-1.4, 0, 1.4, 3.2, y + 0.75, 0.6, 0.25);
                K.col(AC.line);
                for (const [a, b] of [[-0.6, -1.5], [0.6, -1.5], [0.6, 1.5], [-0.6, 1.5]]) K.seg(-1.4 + a, y, b, -1.4 + a, y + 0.75, b);
                K.fine().col(AC.detail, 0.8).rect(-1.75, -1.1, -1.05, 1.1, y + 0.45);
            }
        }
    }

    /*  LÀNG CHÀI — cầu tàu gỗ vươn ra biển (mép mặt cầu, lan can, ván, cọc, đầu chữ
        T), nhà sàn mái dốc dựng trên cọc hai bên, thuyền neo dọc cầu (vài chiếc có
        dàn đèn câu mực), giàn phơi trên bờ. Rạch Vẹm có thêm sao biển dưới nước
        nông — đặc sản làm nên tên "làng chài sao biển". */
    function fishingVillage(K, lon, lat, kind) {
        const [px0, py0] = snapLand(...lonLatToPx(lon, lat));
        const c = coastSite(px0, py0), yaw = c.sea, SY = SEA_Y(), dk = SY + 1.3;
        const LEN = kind === 'river' ? 15 : 26;
        K.frame(c.x, 0, c.z, yaw);
        K.coarse().col(AC.line);
        for (const v of [-0.45, 0.45]) K.seg(-1, Math.max(dk, c.y), v, LEN, dk, v);
        K.rect(LEN - 2.4, -2, LEN + 0.6, 2, dk);
        for (let u = 1; u <= LEN; u += 2) for (const v of [-0.45, 0.45]) K.seg(u, SY - 1.0, v, u, dk, v);
        K.fine().col(AC.detail, 0.8);
        for (const v of [-0.42, 0.42]) K.seg(-1, Math.max(dk, c.y) + 0.45, v, LEN - 2.4, dk + 0.45, v);
        for (let u = -0.6; u < LEN; u += 0.6) K.seg(u, dk, -0.45, u, dk, 0.45);
        //  Nhà sàn hai bên cầu.
        for (let i = 0; i < 6 && 6 + i * 3 < LEN - 3; i++) {
            const u = 6 + i * 3, v = (i % 2 ? 1 : -1) * 2.2;
            K.coarse().col(AC.line).rect(u - 1.1, v - 1, u + 1.1, v + 1, dk);
            for (const [a, b] of [[-1, -0.9], [1, -0.9], [1, 0.9], [-1, 0.9]]) K.seg(u + a, SY - 1.0, v + b, u + a, dk, v + b);
            K.box(u, v, 1.9, 1.6, dk, 0.95).col(AC.roof).gable(u, v, 1.9, 1.6, dk + 0.95, 0.7, 0.2);
            K.fine().col(AC.detail, 0.8).seg(u - 0.2, dk, v - Math.sign(v) * 0.8, u - 0.2, dk + 0.7, v - Math.sign(v) * 0.8)
                .seg(u + 0.2, dk, v - Math.sign(v) * 0.8, u + 0.2, dk + 0.7, v - Math.sign(v) * 0.8)
                .seg(u - 0.35, dk, v - Math.sign(v) * 0.45, u - 0.35, dk, v - Math.sign(v) * 1.0).seg(u + 0.35, dk, v - Math.sign(v) * 0.45, u + 0.35, dk, v - Math.sign(v) * 1.0);
        }
        //  Thuyền neo dọc cầu: hướng mũi ra biển, đóng dấu từ hình mẫu.
        const hx = Math.cos(yaw), hz = Math.sin(yaw);
        const moor = [[LEN - 4.5, 3.4, 1], [LEN - 0.8, -3.0, 1], [LEN - 9, -3.6, 0], [LEN + 2.2, 0.0, 1], [4, 3.4, 0]];
        for (const [u, v, squid] of moor) {
            if (u > LEN + 3) continue;
            const wx = K.wx(u, v), wz = K.wz(u, v);
            K.frame(0, 0, 0, 0).coarse().col(AC.line).stamp(SHP_FISH, wx, SY, wz, hx, hz, 1.5, 0, 7);
            K.fine().col(AC.detail, 0.85).stamp(SHP_FISH, wx, SY, wz, hx, hz, 1.5, 7);
            if (squid) K.col(AC.warm).stamp(SHP_SQUID, wx, SY, wz, hx, hz, 1.5);
            K.frame(c.x, 0, c.z, yaw);
        }
        //  Giàn phơi cá, mực trên bờ.
        K.fine().col(AC.detail, 0.75);
        for (const v of [-4, 0, 4]) {
            const [x, y] = localPx(c, yaw, -3, v);
            if (!isLand(x, y)) continue;
            const g = groundY(x, y);
            K.rect(-3.9, v - 0.1, -2.1, v + 0.1, g + 0.8);
            for (const u of [-3.8, -2.2]) K.seg(u, g, v, u, g + 0.8, v);
            for (let j = 1; j <= 3; j++) K.seg(-3.9, g + 0.8 - j * 0.15, v, -2.1, g + 0.8 - j * 0.15, v);
        }
        if (kind === 'starfish') {
            K.col(AC.star, 0.95);
            _sd = 20261011;
            for (let i = 0; i < 14; i++) {
                const u = rnd(3, 20), v = rnd(-9, 9), r = rnd(0.25, 0.4), rot = rnd(0, 6.28);
                const [x, y] = localPx(c, yaw, u, v);
                if (isLand(x, y)) continue;
                const pts = [];
                for (let k = 0; k < 10; k++) { const a = rot + k / 10 * Math.PI * 2, rr = k % 2 ? r * 0.42 : r; pts.push([u + Math.cos(a) * rr, SY + 0.03, v + Math.sin(a) * rr]); }
                K.poly(pts, true);
            }
        }
    }

    /*  GRAND WORLD — "Venice" của Phú Quốc: kênh uốn lượn có ba cầu vòm, dãy nhà
        phố hai bờ (mái dốc, cửa, ban công), mái vòm tre "Huyền thoại Tre" ở đầu
        kênh; thuyền gondola chạy dọc kênh là bể nét động. */
    function grandWorld(K, A, s) {
        const yaw = dirTo(s.px, s.py, false) + Math.PI / 2;
        const zc = x => 1.4 * Math.sin(x * 0.35);
        K.frame(s.x, 0, s.z, yaw);
        //  Mặt kênh: một mức nước cho cả kênh (thấp nhất dọc tuyến), bờ kênh bám đất.
        let wl = Infinity;
        for (let x = -10; x <= 10; x += 0.5) wl = Math.min(wl, K.gy(x, zc(x)));
        const base = wl;
        K.coarse().col(AC.water);
        for (const off of [-0.9, 0.9]) K.drape(f => { const x = -10 + 20 * f; return [x, zc(x) + off]; }, 60);
        K.fine().col(AC.water, 0.6).curve(f => { const x = -10 + 20 * f; return [x, wl + 0.06, zc(x)]; }, 40).coarse();
        for (const xb of [-4.5, 0.2, 4.6]) {                                   // cầu vòm bắc ngang kênh
            const gb = Math.max(K.gy(xb, zc(xb) - 1.3), K.gy(xb, zc(xb) + 1.3));
            const arc = (ex, dy) => f => [xb + ex, gb + 0.1 + dy + 0.6 * Math.sin(f * Math.PI), zc(xb) - 1.3 + 2.6 * f];
            K.coarse().col(AC.line).curve(arc(-0.35, 0), 10).curve(arc(0.35, 0), 10);
            K.fine().col(AC.detail, 0.8).curve(arc(-0.33, 0.4), 10).curve(arc(0.33, 0.4), 10);
            for (let i = 0; i <= 10; i++) { const p = arc(0, 0)(i / 10); K.seg(xb - 0.35, p[1], p[2], xb + 0.35, p[1], p[2]); }
            K.coarse();
        }
        //  Nhà phố hai bờ — chiều cao xen kẽ cho ra dáng phố cổ.
        for (const side of [-1, 1]) for (let x = -9.4; x <= 9.4; x += 1.25) {
            if (Math.abs(x - -4.5) < 0.8 || Math.abs(x - 0.2) < 0.8 || Math.abs(x - 4.6) < 0.8) continue;
            const v = zc(x) + side * 2.0, h = 1.2 + 0.3 * ((Math.round(x * 4) + (side > 0 ? 1 : 0)) % 3);
            const g = Math.max(K.gy(x - 0.5, v - 0.6), K.gy(x + 0.5, v - 0.6), K.gy(x - 0.5, v + 0.6), K.gy(x + 0.5, v + 0.6));
            K.coarse().col(AC.line).box(x, v, 1.1, 1.4, g, h).col(AC.roof).gable(x, v, 1.1, 1.4, g + h, 0.5, 0.06);
            K.fine().col(AC.detail, 0.75);
            const fz = v - side * 0.7;
            for (const fy of [0.45, 0.95]) if (fy < h - 0.1) K.seg(x - 0.3, g + fy, fz, x + 0.3, g + fy, fz);
            K.seg(x - 0.15, g, fz, x - 0.15, g + 0.35, fz).seg(x + 0.15, g, fz, x + 0.15, g + 0.35, fz);
        }
        //  Mái vòm tre ở đầu kênh: kinh tuyến + vĩ tuyến.
        const dx = 12.2, dz = zc(10), gd = Math.max(K.gy(dx - 1.5, dz), K.gy(dx + 1.5, dz), K.gy(dx, dz - 1.5), K.gy(dx, dz + 1.5));
        K.coarse().col(AC.line);
        for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; K.curve(f => [dx + Math.cos(a) * 2.4 * Math.cos(f * Math.PI / 2), gd + 2.4 * Math.sin(f * Math.PI / 2), dz + Math.sin(a) * 2.4 * Math.cos(f * Math.PI / 2)], 8); }
        K.ell(dx, gd, dz, 2.4, 2.4, 28);
        K.fine().col(AC.detail, 0.8);
        for (const e of [0.35, 0.7, 1.05, 1.35]) K.ell(dx, gd + 2.4 * Math.sin(e), dz, 2.4 * Math.cos(e), 2.4 * Math.cos(e), 24);
        //  Gondola: 3 chiếc lượn dọc kênh, đi rồi quay lại.
        const NG = 3, P = linePool(NG * 8, i => (i % 8) >= 6 ? rgba(AC.warm) : rgba(AC.detail, 0.95));
        A.group.add(P.mesh);
        const fr = { ox: s.x, oz: s.z, c: Math.cos(yaw), s: Math.sin(yaw), y: base + 0.12 };
        A.upd.push(tt => {
            pen.at(P.arr, 0);
            for (let g = 0; g < NG; g++) {
                const ph = (tt * 0.035 + g / NG) % 2, f = ph < 1 ? ph : 2 - ph, dir = ph < 1 ? 1 : -1;
                const x = -9 + 18 * f, z = zc(x) + (g - 1) * 0.3, dzdx = 1.4 * 0.35 * Math.cos(x * 0.35) * dir;
                const lx = dir, lz = dzdx, L = Math.hypot(lx, lz);
                const hx = (lx * fr.c - lz * fr.s) / L, hz = (lx * fr.s + lz * fr.c) / L;
                pen.frame(fr.ox + x * fr.c - z * fr.s, fr.y, fr.oz + x * fr.s + z * fr.c, hx, hz, 0.55);
                pen.shape(SHP_GONDOLA);
            }
            P.mesh.geometry.attributes.position.needsUpdate = true;
        });
    }

    /*  VINPEARL SAFARI — cổng vòm, ba khu chuồng thả có hàng rào cọc, tháp quan
        sát, và vài con vật vẽ nét (hươu cao cổ, voi) trong khu thả. */
    function safari(K, s) {
        const yaw = dirTo(s.px, s.py, false) + Math.PI;
        K.frame(s.x, 0, s.z, yaw).coarse().col(AC.line);
        const gG = Math.max(K.gy(0, -1.4), K.gy(0, 1.4));
        K.box(0, -1.4, 0.6, 0.6, gG, 2.2).box(0, 1.4, 0.6, 0.6, gG, 2.2).seg(0, gG + 2.2, -1.7, 0, gG + 2.2, 1.7);
        K.col(AC.roof).gable(0, 0, 1.0, 3.8, gG + 2.2, 0.7, 0.15);
        const pens = [[[2, -6], [8, -7], [10, -2], [6, 0.5], [2.5, -2]], [[2.5, 1.5], [7, 1], [9.5, 5.5], [5, 8], [2, 5]], [[-3, 3], [-8, 2], [-9, 7], [-4, 8.5]]];
        for (const pg of pens) {
            for (let i = 0; i < pg.length; i++) {
                const [u0, v0] = pg[i], [u1, v1] = pg[(i + 1) % pg.length], L = Math.hypot(u1 - u0, v1 - v0);
                K.coarse().col(AC.line, 0.9).drape(f => [u0 + (u1 - u0) * f, v0 + (v1 - v0) * f], Math.ceil(L / 0.7), 0.45);
                K.fine().col(AC.detail, 0.75);
                for (let d = 0; d < L; d += 0.7) { const f = d / L, u = u0 + (u1 - u0) * f, v = v0 + (v1 - v0) * f, g = K.gy(u, v); K.seg(u, g, v, u, g + 0.45, v); }
            }
        }
        K.coarse().col(AC.line);
        const gW = K.gy(-6, -4);
        for (const [a, b] of [[-0.4, -0.4], [0.4, -0.4], [0.4, 0.4], [-0.4, 0.4]]) K.seg(-6 + a, gW, -4 + b, -6 + a * 0.6, gW + 3, -4 + b * 0.6);
        K.rect(-6.45, -4.45, -5.55, -3.55, gW + 3).col(AC.roof).pyramid(-6, -4, 0.9, 0.9, gW + 3.4, 0.5);
        //  Hươu cao cổ & voi — nét nghiêng mặt bên, đứng trên đúng mặt đất.
        K.fine().col(AC.warm, 0.95);
        const giraffe = (u, v, sc) => { const g = K.gy(u, v); K.poly([[u, g, v], [u + 0.1 * sc, g + 0.9 * sc, v], [u + 0.9 * sc, g + 1.0 * sc, v], [u + 1.0 * sc, g, v]])
            .poly([[u + 0.1 * sc, g + 0.9 * sc, v], [u - 0.25 * sc, g + 2.0 * sc, v], [u - 0.55 * sc, g + 2.0 * sc, v]]).seg(u + 0.9 * sc, g + 1.0 * sc, v, u + 1.25 * sc, g + 0.75 * sc, v); };
        const elephant = (u, v, sc) => { const g = K.gy(u, v); K.poly([[u, g, v], [u, g + 0.9 * sc, v], [u + 1.4 * sc, g + 1.05 * sc, v], [u + 1.6 * sc, g + 0.6 * sc, v], [u + 1.6 * sc, g, v]])
            .poly([[u, g + 0.9 * sc, v], [u - 0.35 * sc, g + 0.75 * sc, v], [u - 0.42 * sc, g + 0.1 * sc, v]]).seg(u + 0.2 * sc, g + 0.8 * sc, v + 0.02, u + 0.25 * sc, g + 0.35 * sc, v + 0.02); };
        giraffe(5, -3.5, 1.1); giraffe(7.2, -4.5, 0.9); elephant(4.5, 4.2, 1.0); elephant(-6.5, 5.5, 0.8);
    }

    /*  DI TÍCH NHÀ TÙ PHÚ QUỐC — khu trại: hàng rào cọc có dây thép gai, bốn chòi
        canh ở bốn góc, bốn dãy nhà giam mái dốc, cổng có bảng. */
    function prisonCamp(K, s) {
        const yaw = dirTo(s.px, s.py, false);
        K.frame(s.x, 0, s.z, yaw).coarse().col(AC.line);
        const fence = [[-5, -3.6], [5, -3.6], [5, 3.6], [-5, 3.6]];
        for (let i = 0; i < 4; i++) {
            const [u0, v0] = fence[i], [u1, v1] = fence[(i + 1) % 4], L = Math.hypot(u1 - u0, v1 - v0);
            const P = f => [u0 + (u1 - u0) * f, v0 + (v1 - v0) * f];
            K.coarse().col(AC.line).drape(P, Math.ceil(L / 0.5), 0.6);
            K.fine().col(AC.detail, 0.75);
            for (let d = 0; d <= L; d += 0.5) { const [u, v] = P(d / L), g = K.gy(u, v); K.seg(u, g, v, u, g + 0.75, v); }
            const n = Math.round(L / 0.25);                                  // dây thép gai: răng cưa trên đỉnh rào
            for (let k = 0; k < n; k++) {
                const [ua, va] = P(k / n), [ub, vb] = P((k + 1) / n);
                K.seg(ua, K.gy(ua, va) + 0.68 + (k % 2) * 0.12, va, ub, K.gy(ub, vb) + 0.68 + ((k + 1) % 2) * 0.12, vb);
            }
        }
        K.coarse().col(AC.line);
        for (const [a, b] of fence) {
            const g = K.gy(a, b);
            for (const [dx, dz] of [[-0.35, -0.35], [0.35, -0.35], [0.35, 0.35], [-0.35, 0.35]]) K.seg(a + dx, g, b + dz, a + dx * 0.7, g + 2.3, b + dz * 0.7);
            K.box(a, b, 0.6, 0.6, g + 2.3, 0.45).col(AC.roof).pyramid(a, b, 0.6, 0.6, g + 2.75, 0.4, 0.15).col(AC.line);
        }
        for (const v of [-2.4, -0.8, 0.8, 2.4]) {
            const g = Math.max(K.gy(-3.4, v), K.gy(-0.6, v), K.gy(2.2, v));
            K.box(-0.6, v, 6, 1.0, g, 0.55).col(AC.roof).gable(-0.6, v, 6, 1.0, g + 0.55, 0.4, 0.1).col(AC.line);
            K.fine().col(AC.detail, 0.7);
            for (let u = -3.2; u <= 2.2; u += 0.9) K.seg(-0.6 + u + 0.3, g + 0.15, v + 0.5, -0.6 + u + 0.3, g + 0.4, v + 0.5);
            K.coarse().col(AC.line);
        }
        const gG = K.gy(5, 0);
        K.seg(5, gG, -0.6, 5, gG + 1.4, -0.6).seg(5, gG, 0.6, 5, gG + 1.4, 0.6).seg(5, gG + 1.4, -0.75, 5, gG + 1.4, 0.75);
        K.fine().col(AC.detail, 0.8).rect(5, -0.55, 5.02, 0.55, gG + 1.25);
    }

    /*  VƯỜN QUỐC GIA — trạm kiểm lâm, chòi quan sát, rừng cây quanh, đường mòn. */
    function nationalPark(K, s) {
        const base = footY(s.px, s.py, 4);
        K.frame(s.x, base, s.z, 0).coarse().col(AC.line).box(0, 0, 2, 1.4, 0, 0.7).col(AC.roof).hip(0, 0, 2, 1.4, 0.7, 0.6, 0.2);
        K.col(AC.line);
        for (const [a, b] of [[-0.45, -0.45], [0.45, -0.45], [0.45, 0.45], [-0.45, 0.45]]) K.seg(3.2 + a, 0, -1.5 + b, 3.2 + a * 0.6, 3.2, -1.5 + b * 0.6);
        K.rect(2.8, -1.9, 3.6, -1.1, 3.2).col(AC.roof).pyramid(3.2, -1.5, 0.8, 0.8, 3.7, 0.5);
        K.fine();
        _sd = 7071;
        for (let i = 0; i < 18; i++) {
            const a = rnd(0, 6.28), r = rnd(3.5, 9), u = Math.cos(a) * r, v = Math.sin(a) * r;
            const [px, py] = [s.px + u, s.py + v];
            if (isLand(px, py)) K.frame(0, 0, 0, 0).tree(px - CX, groundY(px, py), py - CZ, rnd(1.4, 2.2), rnd(0.45, 0.7));
        }
        K.frame(s.x, base, s.z, 0).col(AC.detail, 0.7).dashed(0.3);
        K.curve(f => [1 + f * 9, 0.05, 0.8 + Math.sin(f * 5) * 1.6], 30);
        K.dashed(0);
    }

    /*  SUỐI TRANH — vách đá, thác nước chảy theo đúng hướng dốc của địa hình tại
        chỗ, vũng thác, cầu gỗ bắc qua suối, lối bậc thang. */
    function waterfall(K, s) {
        //  Ghim nằm ở đáy suối; thác thì ở vách. Dò quanh 10 pixel tìm chỗ dốc
        //  nhất, đặt thác ở đó và cho nước đổ theo đúng hướng xuống dốc.
        let best = 0, bx0 = s.px, by0 = s.py, gxB = 0, gzB = 1;
